schema_version: slac.dataset_manifest/v0.1
name: synthetic_camera_lidar_imu
description: Tiny placeholder dataset manifest for CLI and schema tests.
time_base: sensor_time_ns
streams:
  camera0:
    kind: image
    count: 0
    topic: /camera/front/image
    sensor: camera0
    frame_id: camera0
  lidar0:
    kind: pointcloud
    count: 0
    topic: /lidar/points
    sensor: lidar0
    frame_id: lidar0
    fields: [x, y, z, intensity]
  imu0:
    kind: imu
    count: 0
    topic: /imu/data
    sensor: imu0
    frame_id: imu0
