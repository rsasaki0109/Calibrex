schema_version: slac.config/v0.1

project:
  name: ethz_real_hand_eye_comparison
  description: Five native AX=XB solvers plus Shah AX=YB on ETHZ ASL robot-arm poses.
  output_dir: outputs/ethz_hand_eye_robot_arm_real
  domain: robotics

dataset:
  type: filesystem
  path: data/public/ethz_hand_eye_robot_arm_real
  time_base: unix_seconds

sensors:
  eye:
    type: camera
    model: intel_sr300_ir
    frame_id: eye

frames:
  hand:
    root: true
  eye:
    parent: hand
    transform:
      estimate: true
      initial:
        translation: [0.0, 0.0, 0.0]
        rotation_quat_xyzw: [0.0, 0.0, 0.0, 1.0]

pipeline:
  type: hand_eye_solver_comparison
  frontends: [ethz_timestamped_pose_csv]
  factors:
    hand_eye_motion_closure:
      enabled: true
      options:
        archive_file: robot_arm_w_color_camera_real.zip
        maximum_time_delta_sec: 0.011
        motion_stride: 60
        absolute_pose_pairing: disjoint
        max_holdout_rotation_rmse_deg: 2.0
        max_holdout_translation_rmse_m: 0.03
        min_known_bad_detectable_fraction: 0.75
        min_horaud_quaternion_normalized_eigengap: 0.001
        min_andreff_rotation_width: 0.0001
        max_andreff_rotation_nullspace_ratio: 0.25
        max_andreff_so3_projection_correction_frobenius: 0.05
        min_shah_rotation_normalized_gap: 0.001
        max_shah_translation_condition_number: 100000000.0
        max_shah_so3_projection_correction_frobenius: 0.05
        max_li_linear_condition_number: 100000000.0
        max_li_so3_projection_correction_frobenius: 0.05
        min_dornaika_horaud_rotation_normalized_gap: 0.001
        max_dornaika_horaud_translation_condition_number: 100000000.0
        max_dornaika_horaud_quaternion_unit_error: 0.000000000001
        min_dornaika_horaud_sign_synchronization_fraction: 0.99

solver:
  backend: native_hand_eye_comparison
  max_iterations: 0
  robust_loss: none
  convergence_tolerance: 1.0e-10
  seed: 0

evaluation:
  holdout_ratio: 0.2
  metrics:
    - hand_eye_park_martin_holdout_rotation_rmse_deg
    - hand_eye_park_martin_holdout_translation_rmse_m
    - hand_eye_park_martin_known_bad_detectable_fraction
    - hand_eye_tsai_lenz_holdout_rotation_rmse_deg
    - hand_eye_tsai_lenz_holdout_translation_rmse_m
    - hand_eye_tsai_lenz_known_bad_detectable_fraction
    - hand_eye_daniilidis_holdout_rotation_rmse_deg
    - hand_eye_daniilidis_holdout_translation_rmse_m
    - hand_eye_daniilidis_known_bad_detectable_fraction
    - hand_eye_horaud_dornaika_holdout_rotation_rmse_deg
    - hand_eye_horaud_dornaika_holdout_translation_rmse_m
    - hand_eye_horaud_dornaika_known_bad_detectable_fraction
    - hand_eye_horaud_dornaika_rotation_axis_rank
    - hand_eye_horaud_dornaika_quaternion_normalized_eigengap
    - hand_eye_common_split_consistent
    - hand_eye_andreff_holdout_rotation_rmse_deg
    - hand_eye_andreff_holdout_translation_rmse_m
    - hand_eye_andreff_known_bad_detectable_fraction
    - hand_eye_andreff_rotation_observable_rank
    - hand_eye_andreff_rotation_minimum_width
    - hand_eye_andreff_rotation_nullspace_ratio
    - hand_eye_andreff_translation_rank
    - hand_eye_andreff_so3_projection_correction_frobenius
    - robot_world_hand_eye_pose_pair_count
    - robot_world_hand_eye_shah_rotation_dominant_multiplicity
    - robot_world_hand_eye_shah_rotation_normalized_gap
    - robot_world_hand_eye_shah_translation_rank
    - robot_world_hand_eye_shah_translation_condition_number
    - robot_world_hand_eye_shah_so3_projection_correction_frobenius_max
    - robot_world_hand_eye_shah_holdout_rotation_rmse_deg
    - robot_world_hand_eye_shah_holdout_translation_rmse_m
    - robot_world_hand_eye_shah_known_bad_detectable_fraction
    - robot_world_hand_eye_li_linear_rank
    - robot_world_hand_eye_li_linear_condition_number
    - robot_world_hand_eye_li_raw_linear_residual_rmse
    - robot_world_hand_eye_li_so3_projection_correction_frobenius_max
    - robot_world_hand_eye_li_shah_common_split_consistent
    - robot_world_hand_eye_li_holdout_rotation_rmse_deg
    - robot_world_hand_eye_li_holdout_translation_rmse_m
    - robot_world_hand_eye_li_known_bad_detectable_fraction
    - robot_world_hand_eye_li_shah_x_rotation_delta_deg
    - robot_world_hand_eye_li_shah_x_translation_delta_m
    - robot_world_hand_eye_li_shah_z_rotation_delta_deg
    - robot_world_hand_eye_li_shah_z_translation_delta_m
    - robot_world_hand_eye_absolute_common_split_consistent
    - robot_world_hand_eye_dornaika_horaud_rotation_dominant_multiplicity
    - robot_world_hand_eye_dornaika_horaud_rotation_normalized_gap
    - robot_world_hand_eye_dornaika_horaud_rotation_objective
    - robot_world_hand_eye_dornaika_horaud_quaternion_unit_error_max
    - robot_world_hand_eye_dornaika_horaud_sign_flip_count
    - robot_world_hand_eye_dornaika_horaud_sign_synchronization_fraction
    - robot_world_hand_eye_dornaika_horaud_translation_rank
    - robot_world_hand_eye_dornaika_horaud_translation_condition_number
    - robot_world_hand_eye_dornaika_horaud_holdout_rotation_rmse_deg
    - robot_world_hand_eye_dornaika_horaud_holdout_translation_rmse_m
    - robot_world_hand_eye_dornaika_horaud_known_bad_detectable_fraction
    - robot_world_hand_eye_dornaika_horaud_shah_x_rotation_delta_deg
    - robot_world_hand_eye_dornaika_horaud_shah_x_translation_delta_m
    - robot_world_hand_eye_dornaika_horaud_shah_z_rotation_delta_deg
    - robot_world_hand_eye_dornaika_horaud_shah_z_translation_delta_m

outputs:
  result: result.yaml
  report: report.html
  artifacts_dir: artifacts
