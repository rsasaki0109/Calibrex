schema_version: slac.config/v0.1

project:
  name: glim_versatile_livox_continuous_time_benchmark
  description: >
    Bounded continuous-time Livox Avia identity self-test on the AIST GLIM
    recording. The duplicated topic is an identity control, not an absolute
    extrinsic ground truth; the benchmark still reserves a temporal holdout
    and compares uniform/no-rejection against adaptive/MAD under one budget.
  output_dir: outputs/glim_versatile_livox_continuous_time_benchmark
  domain: research

dataset:
  type: rosbag2
  path: data/public/glim_versatile/livox_rosbag2_gt_restamped
  time_base: ros_time
  odometry_topic: /odom

sensors:
  livox_avia:
    type: lidar
    model: livox_avia
    topic: /livox/points
    frame_id: livox
    fields: [x, y, z, intensity, t]
    point_time_field: t
    solid_state:
      architecture: solid_state
      scan_pattern: non_repetitive
      point_time_reference: message_stamp
      point_time_unit: seconds
      point_time_available: true
      point_time_field: t
      intrinsic_calibration:
        source: manufacturer
        model: manufacturer_native
  livox_avia_copy:
    type: lidar
    model: livox_avia
    topic: /livox/points_copy
    frame_id: livox_copy
    fields: [x, y, z, intensity, t]
    point_time_field: t
    solid_state:
      architecture: solid_state
      scan_pattern: non_repetitive
      point_time_reference: message_stamp
      point_time_unit: seconds
      point_time_available: true
      point_time_field: t
      intrinsic_calibration:
        source: manufacturer
        model: manufacturer_native

frames:
  livox_avia:
    root: true
  livox_avia_copy:
    parent: livox_avia
    transform:
      estimate: true
      initial:
        translation: [0.0, 0.0, 0.0]
        rotation_quat_xyzw: [0.0, 0.0, 0.0, 1.0]
      prior_sigma:
        translation_m: 0.2
        rotation_deg: 10.0

pipeline:
  type: multi_lidar_evidence
  frontends:
    - rosbag2_pointcloud2_reader
    - lidar_pair_voxel_evidence
  factors:
    lidar_rig_point_to_plane:
      enabled: true
      options:
        voxel_size_m: 0.5
        correspondence_gate_m: 1.5
        max_source_points: 3000
        max_source_messages: 6
        max_target_points: 400
        max_target_messages: 36
        max_replay_duration_s: 60.0
        use_point_time_offsets: true
        inject_time_offset_s: 0.0
        online_gate_min_rank: 6
        online_gate_max_holdout_rmse_m: 0.40
        online_gate_max_rolling_regression_m: 0.15
        continuous_time_initial_offset_s: 0.0
        continuous_time_max_abs_offset_s: 0.20
        continuous_time_initial_step_s: 0.02
        continuous_time_minimum_step_s: 0.005
        continuous_time_max_iterations: 8
        continuous_time_min_correspondences: 6
        continuous_time_max_source_records: 2000
        continuous_time_max_target_points_per_split: 1200
        continuous_time_correspondence_refinement_iterations: 1
        continuous_time_fixed_extrinsic_max_iterations: 8
        continuous_time_adaptive_range_reference_m: 10.0
        continuous_time_adaptive_range_exponent: 0.5
        continuous_time_adaptive_min_voxel_size_m: 0.25
        continuous_time_adaptive_max_voxel_size_m: 1.5
        continuous_time_adaptive_min_points_per_voxel: 6
        continuous_time_voxel_strategy: adaptive

solver:
  backend: native_lidar_point_to_plane
  max_iterations: 40
  robust_loss: huber
  convergence_tolerance: 1.0e-6

evaluation:
  holdout_ratio: 0.2
  solid_state:
    enabled: true
    require_point_time: true
    require_independent_holdout: true
    min_holdout_windows: 2

outputs:
  result: result.yaml
  report: report.html
  artifacts_dir: artifacts
