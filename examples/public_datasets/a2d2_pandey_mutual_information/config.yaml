schema_version: slac.config/v0.1

project:
  name: a2d2_pandey_mutual_information
  description: Pandey targetless reflectivity/luminance MI on real A2D2 pairs
  output_dir: outputs/a2d2_pandey_mutual_information
  domain: autonomous_driving

dataset:
  type: a2d2_lidar
  path: data/public/a2d2_pandey_mutual_information
  sample_limit: 2

sensors:
  camera0:
    type: camera
    model: a2d2_front_left_fisheye
    frame_id: camera0
  lidar0:
    type: lidar
    model: a2d2_preregistered_camera_view_cloud
    frame_id: lidar0

frames:
  base_link:
    root: true
  camera0:
    parent: base_link
    transform:
      estimate: false
  lidar0:
    parent: base_link
    transform:
      estimate: true
      prior_sigma:
        translation_m: 0.1
        rotation_deg: 5.0

pipeline:
  type: multi_sensor_slac
  factors:
    lidar_camera_mutual_information:
      enabled: true
      options:
        camera_name: front_left
        max_points_per_frame: 4000
        min_train_observations: 1
        histogram_bins: 24
        min_projected_points: 128
        initial_translation_m: [0.02, -0.015, 0.01]
        initial_rotation_rpy_deg: [0.3, -0.2, 0.4]
        initial_step_size: 0.01
        max_step_size: 0.03
        known_bad_translation_m: 0.05
        known_bad_rotation_deg: 5.0

solver:
  backend: native_pandey_mutual_information
  max_iterations: 12
  robust_loss: none
  convergence_tolerance: 1.0e-5
  seed: 11

evaluation:
  holdout_ratio: 0.5
  metrics:
    - lidar_camera_mutual_information_score
    - pandey_mutual_information_raw
    - pandey_projected_point_count
    - pandey_known_bad_detectable_fraction
    - pandey_objective_curvature_rank
    - pandey_public_accuracy_independent
    - pandey_preregistered_reference_translation_error_m
    - pandey_preregistered_reference_rotation_error_deg

outputs:
  result: result.yaml
  report: report.html
  artifacts_dir: artifacts
