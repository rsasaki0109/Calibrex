schema_version: slac.config/v0.1

project:
  name: livox_horizon_horizon_registration_comparison
  description: Public Livox pair evaluated with native ICP and optional GICP/NDT adapters.
  output_dir: outputs/livox_horizon_horizon_icp_comparison
  domain: robotics

dataset:
  type: livox_pcd
  path: data/public/livox_horizon_horizon_pair
  time_base: frame_index

sensors:
  base_horizon:
    type: lidar
    model: livox_horizon
    frame_id: base_horizon
    fields: [x, y, z, intensity]
  target_horizon:
    type: lidar
    model: livox_horizon
    frame_id: target_horizon
    fields: [x, y, z, intensity]

frames:
  base_horizon:
    root: true
  target_horizon:
    parent: base_horizon
    transform:
      estimate: true
      initial:
        translation: [0.0, -0.13, 0.0]
        rotation_quat_xyzw: [0.0, 0.0, 0.0, 1.0]

pipeline:
  type: multi_lidar_registration_comparison
  frontends: [livox_pcd_reader, deterministic_voxel_centroids]
  factors:
    registration_backend_comparison:
      enabled: true
      options:
        voxel_size_m: 0.5
        max_points_per_cloud: 500
        correspondence_distance_m: 1.5
        trim_fraction: 0.8
        holdout_voxel_size_m: 1.0
        max_holdout_rmse_m: 0.75
        min_inlier_fraction: 0.25

solver:
  backend: native_registration_comparison
  max_iterations: 30
  robust_loss: trimmed
  convergence_tolerance: 1.0e-6
  seed: 7

evaluation:
  holdout_ratio: 0.2
  metrics:
    - registration_dataset_available
    - registration_native_icp_train_rmse_m
    - registration_native_icp_holdout_rmse_m
    - registration_native_icp_inlier_fraction
    - registration_native_icp_min_correspondence_jaccard
    - registration_native_icp_weak_direction_count
    - registration_native_icp_symmetry_ambiguous
    - registration_open3d_gicp_available
    - registration_open3d_gicp_holdout_rmse_m
    - registration_external_ndt_available
    - registration_external_ndt_holdout_rmse_m

outputs:
  result: result.yaml
  report: report.html
  artifacts_dir: artifacts
