schema_version: slac.config/v0.1

project:
  name: livox_horizon_horizon_registration_comparison
  description: Public Livox pair evaluated with native point/plane ICP and GICP/NDT adapters.
  output_dir: outputs/livox_horizon_horizon_icp_comparison
  domain: robotics

dataset:
  type: livox_pcd
  path: data/public/livox_horizon_horizon_pair
  time_base: frame_index

sensors:
  base_horizon:
    type: lidar
    model: livox_horizon
    frame_id: base_horizon
    fields: [x, y, z, intensity]
  target_horizon:
    type: lidar
    model: livox_horizon
    frame_id: target_horizon
    fields: [x, y, z, intensity]

frames:
  base_horizon:
    root: true
  target_horizon:
    parent: base_horizon
    transform:
      estimate: true
      initial:
        translation: [0.0, -0.13, 0.0]
        rotation_quat_xyzw: [0.0, 0.0, 0.0, 1.0]

pipeline:
  type: multi_lidar_registration_comparison
  frontends: [livox_pcd_reader, deterministic_voxel_centroids]
  factors:
    registration_backend_comparison:
      enabled: true
      options:
        voxel_size_m: 0.5
        max_points_per_cloud: 500
        correspondence_distance_m: 1.5
        trim_fraction: 0.8
        holdout_voxel_size_m: 1.0
        max_holdout_rmse_m: 0.75
        min_inlier_fraction: 0.25
        min_correspondence_jaccard: 0.5
        normal_neighbor_count: 12
        minimum_normal_eigengap: 0.02
        min_valid_target_normal_fraction: 0.5
        max_point_to_plane_condition_number: 100000000.0
        max_point_to_plane_holdout_rmse_m: 0.5
        point_to_plane_probe_margin_m: 0.005
        min_point_to_plane_probe_detectable_fraction: 0.75

solver:
  backend: native_registration_comparison
  max_iterations: 30
  robust_loss: trimmed
  convergence_tolerance: 1.0e-6
  seed: 7

evaluation:
  holdout_ratio: 0.2
  metrics:
    - registration_dataset_available
    - registration_native_icp_train_rmse_m
    - registration_native_icp_holdout_rmse_m
    - registration_native_icp_inlier_fraction
    - registration_native_icp_min_correspondence_jaccard
    - registration_native_icp_weak_direction_count
    - registration_native_icp_symmetry_ambiguous
    - registration_chen_medioni_valid_target_normal_fraction
    - registration_chen_medioni_target_normal_eigengap_minimum
    - registration_chen_medioni_tangent_rank
    - registration_chen_medioni_tangent_condition_number
    - registration_chen_medioni_train_point_to_plane_rmse_m
    - registration_chen_medioni_holdout_point_to_plane_rmse_m
    - registration_chen_medioni_known_bad_detectable_fraction
    - registration_chen_medioni_common_train_rmse_m
    - registration_chen_medioni_common_holdout_rmse_m
    - registration_chen_medioni_common_inlier_fraction
    - registration_chen_medioni_common_min_correspondence_jaccard
    - registration_chen_medioni_common_weak_direction_count
    - registration_open3d_gicp_available
    - registration_open3d_gicp_train_rmse_m
    - registration_open3d_gicp_holdout_rmse_m
    - registration_open3d_gicp_inlier_fraction
    - registration_open3d_gicp_min_correspondence_jaccard
    - registration_open3d_gicp_weak_direction_count
    - registration_open3d_gicp_native_rotation_delta_deg
    - registration_open3d_gicp_native_translation_delta_m
    - registration_external_ndt_available
    - registration_external_ndt_train_rmse_m
    - registration_external_ndt_holdout_rmse_m
    - registration_external_ndt_inlier_fraction
    - registration_external_ndt_min_correspondence_jaccard
    - registration_external_ndt_weak_direction_count
    - registration_external_ndt_native_rotation_delta_deg
    - registration_external_ndt_native_translation_delta_m
    - registration_backend_common_split_consistent

outputs:
  result: result.yaml
  report: report.html
  artifacts_dir: artifacts
