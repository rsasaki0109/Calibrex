schema_version: slac.config/v0.1

project:
  name: livox_horizon_horizon_evidence
  description: Public Livox Horizon-Horizon solid-state LiDAR-to-LiDAR evidence demo.
  output_dir: outputs/livox_horizon_horizon_pcd_sample
  domain: robotics

dataset:
  type: livox_pcd
  path: data/public/livox_horizon_horizon_pair
  time_base: frame_index

sensors:
  base_horizon:
    type: lidar
    model: livox_horizon
    frame_id: base_horizon
    fields: [x, y, z, intensity]
    solid_state:
      architecture: solid_state
      scan_pattern: non_repetitive
      point_time_reference: unknown
      point_time_unit: unknown
      point_time_available: false
      intrinsic_calibration:
        source: manufacturer
        model: manufacturer_native
      notes:
        - vendor calibration is declared but no raw calibration artifact is bundled in this sample
  target_horizon:
    type: lidar
    model: livox_horizon
    frame_id: target_horizon
    fields: [x, y, z, intensity]
    solid_state:
      architecture: solid_state
      scan_pattern: non_repetitive
      point_time_reference: unknown
      point_time_unit: unknown
      point_time_available: false
      intrinsic_calibration:
        source: manufacturer
        model: manufacturer_native
      notes:
        - vendor calibration is declared but no raw calibration artifact is bundled in this sample

frames:
  base_horizon:
    root: true
  target_horizon:
    parent: base_horizon
    transform:
      estimate: true
      initial:
        translation: [0.0, -0.13, 0.0]
        rotation_quat_xyzw: [0.0, 0.0, 0.0, 1.0]
      prior_sigma:
        translation_m: 0.2
        rotation_deg: 10.0

pipeline:
  type: multi_lidar_evidence
  frontends:
    - livox_pcd_reader
    - lidar_pair_voxel_evidence
  factors:
    fixed_lidar_mount_prior:
      enabled: true

solver:
  backend: scipy
  max_iterations: 20
  robust_loss: huber
  convergence_tolerance: 1.0e-6

evaluation:
  holdout_ratio: 0.2
  solid_state:
    enabled: true
    require_point_time: false
    require_temperature: false
    require_independent_holdout: false
    min_temperature_span_c: 5.0
    min_distance_span_m: 5.0
    min_fov_azimuth_deg: 20.0
    min_fov_elevation_deg: 5.0
    min_points_per_distance_bin: 20
  metrics:
    - lidar_frame_coverage
    - lidar_point_coverage
    - lidar_pair_source_voxel_recall_in_target
    - lidar_pair_shared_voxel_centroid_rmse_m
    - lidar_pair_holdout_point_to_plane_p90_abs_m
    - lidar_pair_holdout_point_to_plane_unmatched_fraction
    - lidar_pair_known_bad_detectable_fraction
    - lidar_pair_known_bad_centroid_rmse_delta_max_m
    - lidar_pair_known_bad_point_to_plane_p90_delta_max_m
    - solid_state_distance_span_m
    - solid_state_fov_azimuth_deg
    - solid_state_fov_elevation_deg
    - solid_state_temperature_span_c
    - solid_state_distance_bin_coverage_fraction
    - solid_state_holdout_window_count
    - solid_state_holdout_independent
    - solid_state_known_bad_detectable_fraction

outputs:
  result: result.yaml
  report: report.html
  artifacts_dir: artifacts
