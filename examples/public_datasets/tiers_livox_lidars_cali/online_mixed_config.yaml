schema_version: slac.config/v0.1

project:
  name: tiers_livox_lidars_cali_online_mixed
  description: >
    Online Velodyne-VLP-16-to-Livox-Horizon extrinsic calibration from the TIERS
    LidarsCali ROS 1 bag. Early Velodyne (/velodyne_points) PointCloud2 messages
    build the fixed 360-degree source voxel map; Livox Horizon (/livox/lidar)
    CustomMsg messages stream as target batches. The initial transform is derived
    from the TIERS dataset README GICP extrinsics (velo_sensor and hori_frame
    relative to base_link); see frames.livox_horizon.transform.initial.
  output_dir: outputs/tiers_livox_lidars_cali_online_mixed
  domain: robotics

dataset:
  type: rosbag1
  path: data/public/tiers_lidars_cali/LidarsCali.bag
  time_base: ros_time
  odometry_topic: /vrpn_client_node/UWBTest/pose

sensors:
  velodyne_vlp16:
    type: lidar
    model: velodyne_vlp16
    topic: /velodyne_points
    frame_id: velo_sensor
    fields: [x, y, z, intensity]
  livox_horizon:
    type: lidar
    model: livox_horizon
    topic: /livox/lidar
    frame_id: horizon_frame
    fields: [x, y, z, intensity, offset_time, line]
    point_time_field: offset_time
    solid_state:
      architecture: solid_state
      scan_pattern: non_repetitive
      point_time_reference: timebase
      point_time_unit: nanoseconds
      point_time_available: true
      point_time_field: offset_time
      intrinsic_calibration:
        source: manufacturer
        model: manufacturer_native

frames:
  velodyne_vlp16:
    root: true
  livox_horizon:
    parent: velodyne_vlp16
    transform:
      estimate: true
      initial:
        translation: [0.181055, -0.010158, -0.244932]
        rotation_quat_xyzw: [0.025553, -0.024266, -0.001430, 0.999378]
      prior_sigma:
        translation_m: 0.3
        rotation_deg: 15.0

pipeline:
  type: multi_lidar_evidence
  frontends:
    - rosbag1_pointcloud2_reader
    - lidar_pair_voxel_evidence
  factors:
    lidar_rig_point_to_plane:
      enabled: true
      options:
        voxel_size_m: 0.5
        correspondence_gate_m: 1.5
        max_source_points: 8000
        max_source_messages: 12
        max_target_points: 1500
        max_target_messages: 36
        max_replay_duration_s: 60.0
        use_point_time_offsets: true
        inject_time_offset_s: 0.0
        online_gate_min_rank: 6
        online_gate_max_holdout_rmse_m: 0.40
        online_gate_max_rolling_regression_m: 0.15

solver:
  backend: native_lidar_point_to_plane
  max_iterations: 40
  robust_loss: huber
  convergence_tolerance: 1.0e-6

evaluation:
  holdout_ratio: 0.2
  solid_state:
    enabled: true
    require_point_time: true
    require_independent_holdout: true
    min_holdout_windows: 2

outputs:
  result: result.yaml
  report: report.html
  artifacts_dir: artifacts
