schema_version: slac.config/v0.1

project:
  name: tiers_livox_lidars_cali_evidence
  description: TIERS LidarsCali Livox Horizon-Avia solid-state LiDAR-pair evidence demo from a ROS 1 bag.
  output_dir: outputs/tiers_livox_lidars_cali
  domain: robotics

dataset:
  type: rosbag1
  path: data/public/tiers_lidars_cali/LidarsCali.bag
  time_base: ros_time

sensors:
  livox_horizon:
    type: lidar
    model: livox_horizon
    topic: /livox/lidar
    frame_id: horizon_frame
    fields: [x, y, z, intensity, offset_time, line]
    point_time_field: offset_time
    solid_state:
      architecture: solid_state
      scan_pattern: non_repetitive
      point_time_reference: timebase
      point_time_unit: nanoseconds
      point_time_available: true
      point_time_field: offset_time
      intrinsic_calibration:
        source: manufacturer
        model: manufacturer_native
      notes:
        - Livox CustomMsg timebase is the first-point clock; clock alignment to ROS pose time requires verification
  livox_avia:
    type: lidar
    model: livox_avia
    topic: /avia/livox/lidar
    frame_id: avia_frame
    fields: [x, y, z, intensity, offset_time, line]
    point_time_field: offset_time
    solid_state:
      architecture: solid_state
      scan_pattern: non_repetitive
      point_time_reference: timebase
      point_time_unit: nanoseconds
      point_time_available: true
      point_time_field: offset_time
      intrinsic_calibration:
        source: manufacturer
        model: manufacturer_native
      notes:
        - Livox CustomMsg timebase is the first-point clock; clock alignment to ROS pose time requires verification

frames:
  livox_horizon:
    root: true
  livox_avia:
    parent: livox_horizon
    transform:
      estimate: true
      initial:
        translation: [0.0, 0.0, 0.0]
        rotation_quat_xyzw: [0.0, 0.0, 0.0, 1.0]
      prior_sigma:
        translation_m: 0.3
        rotation_deg: 15.0

pipeline:
  type: multi_lidar_evidence
  frontends:
    - rosbag1_pointcloud2_reader
    - lidar_pair_voxel_evidence
  factors:
    fixed_lidar_mount_prior:
      enabled: true
    lidar_rig_point_to_plane:
      enabled: true
      options:
        voxel_size_m: 0.5
        correspondence_gate_m: 1.5
        max_source_points: 8000
        max_source_messages: 12
        max_target_points: 1500
        max_target_messages: 36
        max_replay_duration_s: 60.0
        use_point_time_offsets: false

solver:
  backend: native_lidar_point_to_plane
  max_iterations: 40
  robust_loss: huber
  convergence_tolerance: 1.0e-6

evaluation:
  holdout_ratio: 0.2
  solid_state:
    enabled: true
    require_point_time: true
    require_independent_holdout: true
    min_holdout_windows: 2
  metrics:
    - lidar_pointcloud_topic_count
    - lidar_frame_coverage
    - lidar_point_coverage
    - lidar_spatial_coverage_m
    - lidar_pair_source_voxel_recall_in_target
    - lidar_pair_shared_voxel_centroid_rmse_m
    - lidar_rig_point_to_plane_rmse_m
    - lidar_pair_holdout_point_to_plane_rmse_m
    - lidar_pair_known_bad_detectable_fraction
    - solid_state_distance_span_m
    - solid_state_fov_azimuth_deg
    - solid_state_fov_elevation_deg
    - solid_state_distance_bin_coverage_fraction
    - solid_state_holdout_window_count
    - solid_state_holdout_independent

outputs:
  result: result.yaml
  report: report.html
  artifacts_dir: artifacts
