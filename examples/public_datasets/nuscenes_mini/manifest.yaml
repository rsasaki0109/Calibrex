schema_version: slac.dataset_manifest/v0.1
name: nuscenes_mini
description: nuScenes mini metadata manifest for multi-sensor inspection examples.
time_base: sensor_time_ns
streams:
  LIDAR_TOP:
    kind: pointcloud
    count: null
    path: samples/LIDAR_TOP/*
    topic: LIDAR_TOP
    sensor: lidar_top
    frame_id: lidar_top
    timestamp_field: timestamp_ns
    fields: [x, y, z, intensity, ring]
  CAM_FRONT:
    kind: image
    count: null
    path: samples/CAM_FRONT/*
    topic: CAM_FRONT
    sensor: cam_front
    frame_id: cam_front
    timestamp_field: timestamp_ns
  RADAR_FRONT:
    kind: radar
    count: null
    path: samples/RADAR_FRONT/*
    topic: RADAR_FRONT
    sensor: radar_front
    frame_id: radar_front
    timestamp_field: timestamp_ns
    fields: [x, y, z, dyn_prop, vx, vy, vx_comp, vy_comp, invalid_state, ambig_state]
  RADAR_FRONT_LEFT:
    kind: radar
    count: null
    path: samples/RADAR_FRONT_LEFT/*
    topic: RADAR_FRONT_LEFT
    sensor: radar_front_left
    frame_id: radar_front_left
    timestamp_field: timestamp_ns
    fields: [x, y, z, dyn_prop, vx, vy, vx_comp, vy_comp, invalid_state, ambig_state]
  RADAR_FRONT_RIGHT:
    kind: radar
    count: null
    path: samples/RADAR_FRONT_RIGHT/*
    topic: RADAR_FRONT_RIGHT
    sensor: radar_front_right
    frame_id: radar_front_right
    timestamp_field: timestamp_ns
    fields: [x, y, z, dyn_prop, vx, vy, vx_comp, vy_comp, invalid_state, ambig_state]
  RADAR_BACK_LEFT:
    kind: radar
    count: null
    path: samples/RADAR_BACK_LEFT/*
    topic: RADAR_BACK_LEFT
    sensor: radar_back_left
    frame_id: radar_back_left
    timestamp_field: timestamp_ns
    fields: [x, y, z, dyn_prop, vx, vy, vx_comp, vy_comp, invalid_state, ambig_state]
  RADAR_BACK_RIGHT:
    kind: radar
    count: null
    path: samples/RADAR_BACK_RIGHT/*
    topic: RADAR_BACK_RIGHT
    sensor: radar_back_right
    frame_id: radar_back_right
    timestamp_field: timestamp_ns
    fields: [x, y, z, dyn_prop, vx, vy, vx_comp, vy_comp, invalid_state, ambig_state]
provenance:
  public_dataset: nuscenes_mini
  official_url: https://www.nuscenes.org/nuscenes
  note: Download nuScenes mini through the official nuScenes flow, then place v1.0-mini metadata and sample files under this dataset root or update config.yaml.
