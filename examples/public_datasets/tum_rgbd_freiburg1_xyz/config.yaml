schema_version: calibrex.config/v0.1

project:
  name: tum_rgbd_freiburg1_xyz_open3d_slac
  description: Public TUM RGB-D fr1/xyz Open3D SLAC adapter example
  output_dir: outputs/tum_rgbd_freiburg1_xyz
  domain: robotics

dataset:
  type: tum_rgbd
  path: examples/public_datasets/tum_rgbd_freiburg1_xyz
  time_base: sensor_time_sec

sensors:
  rgbd0:
    type: camera
    model: tum_rgbd
    topic: rgb
    frame_id: rgbd0
    intrinsics:
      estimate: false
      fx: 517.3
      fy: 516.5
      cx: 318.6
      cy: 255.3
      distortion_model: radtan
      distortion: [0.2624, -0.9531, -0.0054, 0.0026, 1.1633]

frames:
  world:
    root: true
  rgbd0:
    parent: world
    transform:
      estimate: true
      initial:
        translation: [0.0, 0.0, 0.0]
        rotation_quat_xyzw: [0.0, 0.0, 0.0, 1.0]
      prior_sigma:
        translation_m: 0.1
        rotation_deg: 5.0

pipeline:
  type: rgbd_open3d_slac
  frontends:
    - tum_rgbd_association
    - rgbd_fragments
    - pose_graph
  factors:
    open3d_slac:
      enabled: true
      options:
        public_dataset_family: tum_rgbd
        depth_scale: 5000.0
        voxel_size_m: 0.03

solver:
  backend: open3d_slac
  max_iterations: 30
  robust_loss: huber
  convergence_tolerance: 1.0e-6

evaluation:
  holdout_ratio: 0.2
  metrics:
    - open3d_slac_backend_available
    - rgbd_fragment_count
    - pose_graph_edges
    - trajectory_consistency

outputs:
  result: result.yaml
  report: report.html
  artifacts_dir: artifacts
