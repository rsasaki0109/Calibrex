schema_version: calibrex.dataset_manifest/v0.1
name: tiers_lidars_dataset_indoor02
description: >
  TIERS multi-lidar dataset Indoor02 office sequence with Velodyne VLP-16,
  Ouster OS1, and VRPN MOCAP pose on a moving platform (~42 s).
time_base: ros_time
streams:
  velodyne_points:
    kind: pointcloud
    path: indoor02.bag
    topic: /velodyne_points
    sensor: velodyne_vlp16
    frame_id: velo_sensor
    fields:
      - x
      - y
      - z
      - intensity
  ouster_os1_points:
    kind: pointcloud
    path: indoor02.bag
    topic: /os_cloud_nodee/points
    sensor: ouster_os1
    frame_id: os1_sensor
    fields:
      - x
      - y
      - z
      - intensity
  mocap_pose:
    kind: pose_graph
    path: indoor02.bag
    topic: /vrpn_client_node/UWBTest/pose
    sensor: mocap_rig
    frame_id: world
    fields:
      - position
      - orientation
provenance:
  source: TIERS multi-modal lidars dataset Indoor02 sequence
  official_url: https://github.com/TIERS/tiers-lidars-dataset
  download_url: https://utufi.sharepoint.com/:u:/s/msteams_0ed7e9/EYXGcc1Z-y1FpnDwQ1geIoEBovXvLfoxZwt36J1_t2PugA?e=UwHhXd
  license: MIT
  size_bytes: "17974826130"
  sha256_first_mib: 164c2f8dcfd42463ad4981ba25a97668f015ced776db2781fc1e4211fd8fd574
  odometry_note: >
    /odom in the Calibrex rosbag2 replay is synthesized from the VRPN MOCAP
    PoseStamped topic (/vrpn_client_node/UWBTest/pose) by
    tools/rosbag1_to_rosbag2_online_pair.py; only the nav_msgs/Odometry envelope
    is authored — the pose trajectory is real MOCAP data.
  kiss_icp_odometry_note: >
    Rig-frame /odom variant (indoor02_rosbag2_kissicp) from KISS-ICP on
    /velodyne_points via tools/rosbag1_to_rosbag2_online_pair.py --odom-source
    kiss-icp; poses are T_world_velo_sensor with T_base_source = identity.
  kiss_icp_odometry_command: >
    uv run tools/rosbag1_to_rosbag2_online_pair.py --src
    data/public/tiers_lidars_dataset/indoor02.bag --dst
    data/public/tiers_lidars_dataset/indoor02_rosbag2_kissicp --topic
    /velodyne_points --topic /os_cloud_nodee/points --restamp-topic
    /os_cloud_nodee/points --odom-source kiss-icp --kiss-icp-topic
    /velodyne_points --kiss-icp-max-range 30.0 --child-frame-id base_link
    --storage sqlite3 --compress none
  kiss_icp_version: "1.3.0"
  kiss_icp_max_range_m: "30.0"
  selftest_note: >
    Identity self-consistency control variant (indoor02_rosbag2_selftest): same
    kiss-icp conversion as indoor02_rosbag2_kissicp plus
    --duplicate-topic /velodyne_points:/velodyne_points_copy for Velodyne
    root vs duplicate calibration with identity ground truth.
  selftest_command: >
    uv run tools/rosbag1_to_rosbag2_online_pair.py --src
    data/public/tiers_lidars_dataset/indoor02.bag --dst
    data/public/tiers_lidars_dataset/indoor02_rosbag2_selftest --topic
    /velodyne_points --topic /os_cloud_nodee/points --restamp-topic
    /os_cloud_nodee/points --odom-source kiss-icp --kiss-icp-topic
    /velodyne_points --kiss-icp-max-range 30.0 --child-frame-id base_link
    --storage sqlite3 --compress none --duplicate-topic
    /velodyne_points:/velodyne_points_copy
  restamp_note: >
    Ouster OS1 (/os_cloud_nodee/points) stamps with since-boot clock in the
    upstream ROS 1 bag. Regenerated rosbag2 variants apply
    --restamp-topic /os_cloud_nodee/points in
    tools/rosbag1_to_rosbag2_online_pair.py (median bag_receive_time -
    header_stamp offset).
  restamp_topic: /os_cloud_nodee/points
  restamp_offset_ns: "1645462364594977536"
  restamp_offset_s: "1645462364.594978"
