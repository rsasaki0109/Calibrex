name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Schema generation
        run: |
          calibrex schema all --output-dir /tmp/calibrex-schemas
          test "$(find /tmp/calibrex-schemas -maxdepth 1 -name '*.schema.json' | wc -l)" -eq 9
      - name: Build package
        run: python -m build
      - name: Upload package artifacts
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: calibrex-dist
          path: dist/*
      - name: Wheel install smoke
        run: |
          python -m venv /tmp/calibrex-wheel-smoke
          /tmp/calibrex-wheel-smoke/bin/python -m pip install dist/*.whl
          /tmp/calibrex-wheel-smoke/bin/calibrex doctor --json
          /tmp/calibrex-wheel-smoke/bin/calibrex schema all --output-dir /tmp/calibrex-wheel-schemas
          test "$(find /tmp/calibrex-wheel-schemas -maxdepth 1 -name '*.schema.json' | wc -l)" -eq 9
      - name: Test
        run: pytest
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy src/calibrex
