name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Schema generation
        run: |
          calibrex schema all --output-dir /tmp/calibrex-schemas
          test "$(find /tmp/calibrex-schemas -maxdepth 1 -name '*.schema.json' | wc -l)" \
            -eq "$(find schemas -maxdepth 1 -name '*.schema.json' | wc -l)"
          diff -ru schemas /tmp/calibrex-schemas
      - name: Koide schema and CLI smoke
        run: |
          calibrex schema koide-pilot --output /tmp/koide-pilot.schema.json
          test -s /tmp/koide-pilot.schema.json
          calibrex schema koide-runner --output /tmp/koide-runner.schema.json
          test -s /tmp/koide-runner.schema.json
          calibrex schema koide-real-pilot-request --output /tmp/koide-real-request.schema.json
          calibrex schema koide-real-pilot-verification --output /tmp/koide-real-verification.schema.json
          calibrex schema koide-real-pilot-finalization --output /tmp/koide-real-finalization.schema.json
      - name: Koide real blocked-path smoke
        run: |
          calibrex validate examples/koide_real_pilot/synthetic/koide_real_pilot_handoff.yaml \
            --kind koide-real-pilot-request --json
          calibrex camera-lidar koide-real-plan \
            --output /tmp/koide-real/request.yaml --json
          test "$(python -c "import yaml; print(yaml.safe_load(open('/tmp/koide-real/request.yaml'))['status'])")" = "BLOCKED"
          if calibrex camera-lidar koide-real-verify \
            /tmp/koide-real/request.yaml \
            --output /tmp/koide-real/verification.yaml --json; then
            echo "missing official evidence unexpectedly passed"
            exit 1
          fi
          test "$(python -c "import yaml; print(yaml.safe_load(open('/tmp/koide-real/verification.yaml'))['status'])")" = "BLOCKED"
          if calibrex camera-lidar koide-real-finalize \
            /tmp/koide-real/request.yaml \
            /tmp/koide-real/verification.yaml \
            --output /tmp/koide-real/finalization.yaml --json; then
            echo "blocked handoff unexpectedly finalized successfully"
            exit 1
          fi
          test "$(python -c "import yaml; print(yaml.safe_load(open('/tmp/koide-real/finalization.yaml'))['status'])")" = "BLOCKED"
          test "$(python -c "import yaml; print(yaml.safe_load(open('/tmp/koide-real/finalization.yaml'))['execution_state'])")" = "NOT_EXECUTED"
          test "$(python -c "import yaml; print(yaml.safe_load(open('/tmp/koide-real/finalization.yaml'))['official_result_claim'])")" = "False"
          calibrex validate /tmp/koide-real/request.yaml \
            --kind koide-real-pilot-request --json
          calibrex validate /tmp/koide-real/verification.yaml \
            --kind koide-real-pilot-verification --json
          calibrex validate /tmp/koide-real/finalization.yaml \
            --kind koide-real-pilot-finalization --json
      - name: Synthetic raw replay smoke
        run: |
          calibrex validate examples/raw_replay/synthetic/synthetic-definition.yaml \
            --kind raw-replay-definition --json
          calibrex replay plan examples/raw_replay/synthetic/synthetic-definition.yaml \
            --output /tmp/raw-replay-plan.json --json
          calibrex replay run examples/raw_replay/synthetic/synthetic-definition.yaml \
            --output-dir /tmp/raw-replay-run --json
          calibrex replay verify /tmp/raw-replay-run/replay-result.json \
            --definition examples/raw_replay/synthetic/synthetic-definition.yaml --json
      - name: Synthetic multi-LiDAR service smoke
        run: |
          calibrex validate examples/multi_lidar_service/synthetic/plan.yaml \
            --kind multi-lidar-service-plan --json
          calibrex multi-lidar-service plan \
            examples/multi_lidar_service/synthetic/plan.yaml \
            --output /tmp/multi-lidar-service/plan/plan.yaml --json
          calibrex multi-lidar-service evaluate \
            /tmp/multi-lidar-service/plan/plan.yaml \
            --output /tmp/multi-lidar-service/evaluation/evaluation.yaml --json
          calibrex multi-lidar-service verify \
            /tmp/multi-lidar-service/evaluation/evaluation.yaml \
            --plan /tmp/multi-lidar-service/plan/plan.yaml --json
      - name: Synthetic camera-IMU service smoke
        run: |
          calibrex validate examples/camera_imu_service/synthetic/plan.yaml \
            --kind camera-imu-service-plan --json
          calibrex camera-imu-service plan \
            examples/camera_imu_service/synthetic/plan.yaml \
            --output /tmp/camera-imu-service/plan/plan.yaml --json
          calibrex camera-imu-service evaluate \
            /tmp/camera-imu-service/plan/plan.yaml \
            --output /tmp/camera-imu-service/evaluation/evaluation.yaml --json
          calibrex camera-imu-service verify \
            /tmp/camera-imu-service/evaluation/evaluation.yaml \
            --plan /tmp/camera-imu-service/plan/plan.yaml --json
      - name: Synthetic radar service smoke
        run: |
          calibrex validate examples/radar_service/synthetic/plan.yaml \
            --kind radar-service-plan --json
          calibrex radar-service plan \
            examples/radar_service/synthetic/plan.yaml \
            --output /tmp/radar-service/plan/plan.yaml --json
          calibrex radar-service evaluate \
            /tmp/radar-service/plan/plan.yaml \
            --output /tmp/radar-service/evaluation/evaluation.yaml --json
          calibrex radar-service verify \
            /tmp/radar-service/evaluation/evaluation.yaml \
            --plan /tmp/radar-service/plan/plan.yaml --json
      - name: Local release smoke
        run: |
          python tools/local_release_smoke.py \
            --venv /tmp/calibrex-wheel-smoke \
            --build-env /tmp/calibrex-wheel-build \
            --schema-dir /tmp/calibrex-wheel-schemas \
            --report-dir /tmp/calibrex-wheel-report
      - name: Upload package artifacts
        if: matrix.python-version == '3.12'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: calibrex-dist
          path: dist/*
      - name: Test
        run: pytest
      - name: Ruff
        run: ruff check .
      - name: Set up Node for browser controller tests
        if: matrix.python-version == '3.12'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Browser worker controller tests
        if: matrix.python-version == '3.12'
        run: node --test tools/test_check_worker_pool.mjs tools/test_browser_webgpu_edge.mjs tools/test_check_dashboard.mjs tools/test_rig_viewer.mjs tools/test_alignment_demo.mjs tools/test_method_gallery.mjs tools/test_camera_lidar_demo.mjs tools/test_evidence_demos.mjs tools/test_camera_imu_timing.mjs
      - name: Install uv
        run: python -m pip install uv
      - name: Mypy
        run: |
          uvx --isolated --with-requirements tools/typecheck-requirements.txt mypy --platform linux src/calibrex
          uvx --isolated --with-requirements tools/typecheck-requirements.txt mypy --platform win32 src/calibrex

  windows-check:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test browser, reports and dataset tools on Windows
        run: >-
          python -m pytest
          tests/unit/test_check_browser.py
          tests/unit/test_check_cache.py
          tests/unit/test_check_report_html.py
          tests/unit/test_estimate_report_html.py
          tests/unit/test_rosbag2_writer.py
          tests/unit/test_kitti_raw_to_rosbag2.py
          tests/unit/test_kitti360_to_rosbag2.py
          tests/unit/test_kitti_drive_fetch.py
          tests/unit/test_kitti_zip_metadata.py
          tests/unit/test_kitti360_archive_metadata.py

  schema-compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Released schema versions stay readable
        run: python tools/check_schema_compat.py

  ros-sourced:
    # Most users run Calibrex in a shell where ROS is sourced.  setup.bash puts
    # ROS site-packages on PYTHONPATH, which bypasses venv isolation and loads
    # ROS pytest plugins, so the ROS-independent core is verified here too.
    runs-on: ubuntu-latest
    container: ros:jazzy-ros-base
    defaults:
      run:
        shell: bash
    steps:
      - name: Install system Python tooling
        run: apt-get update && apt-get install -y --no-install-recommends git python3-venv
      - uses: actions/checkout@v4
      - name: Trust the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Install into a venv
        run: |
          python3 -m venv /tmp/calibrex-venv
          /tmp/calibrex-venv/bin/python -m pip install -e ".[dev]"
      - name: Test with ROS sourced
        run: |
          source /opt/ros/jazzy/setup.bash
          test -n "$PYTHONPATH"
          /tmp/calibrex-venv/bin/python -m pytest
      - name: Doctor reports the ROS-independent core
        run: |
          source /opt/ros/jazzy/setup.bash
          /tmp/calibrex-venv/bin/calibrex doctor --json > /tmp/doctor.json
          /tmp/calibrex-venv/bin/python -c "import json, sys; env = json.load(open('/tmp/doctor.json'))['environment']; print(env['python_path']); sys.exit(0 if env['core_ros_independent'] else 1)"

  opencv-adapter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install OpenCV adapter
        run: python -m pip install -e ".[dev,opencv]"
      - name: Test OpenCV hand-eye conventions
        run: pytest tests/unit/test_opencv_hand_eye_adapters.py tests/unit/test_visual_rotation.py tests/unit/test_camera_focal.py

  numba-adapter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Numba adapter
        run: python -m pip install -e ".[dev,numba]"
      - name: Test fused histograms and ordered CPU execution
        run: >-
          pytest tests/unit/test_numba_depth_to_depth_adapter.py
          tests/unit/test_numba_continuous_time_queries.py
          tests/unit/test_compiled_lidar_linearization.py
          tests/unit/test_packed_continuous_time_lidar.py
          tests/unit/test_cpu_frame_parallelism.py
          tests/unit/test_depth_to_depth_runtime.py
          tests/unit/test_borer_depth_to_depth_solver.py
          tests/unit/test_borer_six_dof_solver.py
          tests/unit/test_lazy_runtime_loading.py
          tests/unit/test_numba_online_edge_adapter.py
          tests/unit/test_online_edge_cpu_benchmark.py
          tests/unit/test_levinson_online_preparation.py
          tests/unit/test_levinson_thrun_online_solver.py

  calibration-action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Exercise local Calibration CI action
        id: calibration
        uses: ./
        with:
          candidate: examples/public_datasets/livox_horizon_horizon_pcd_sample/cached_evidence_result.yaml
          baseline: examples/public_datasets/livox_horizon_horizon_pcd_sample/cached_evidence_result.yaml
          enforce: "false"
      - name: Verify action outputs
        env:
          CALIBRATION_STATUS: ${{ steps.calibration.outputs.status }}
          CALIBRATION_ARTIFACT: ${{ steps.calibration.outputs.artifact }}
          CALIBRATION_SUMMARY: ${{ steps.calibration.outputs.summary }}
        run: |
          test "${CALIBRATION_STATUS}" = "inconclusive"
          test -f "${CALIBRATION_ARTIFACT}"
          test -f "${CALIBRATION_SUMMARY}"
      - name: Upload calibration CI artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calibration-ci-smoke
          path: calibrex-ci/
