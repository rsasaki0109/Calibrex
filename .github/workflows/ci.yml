name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Schema generation
        run: |
          slac schema all --output-dir /tmp/slac-schemas
          test "$(find /tmp/slac-schemas -maxdepth 1 -name '*.schema.json' | wc -l)" -eq 18
      - name: Local release smoke
        run: |
          python tools/local_release_smoke.py \
            --venv /tmp/slac-wheel-smoke \
            --build-env /tmp/slac-wheel-build \
            --schema-dir /tmp/slac-wheel-schemas \
            --report-dir /tmp/slac-wheel-report
      - name: Upload package artifacts
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: slac-dist
          path: dist/*
      - name: Test
        run: pytest
      - name: Ruff
        run: ruff check .
      - name: Install uv
        run: python -m pip install uv
      - name: Mypy
        run: uvx --with pydantic --with PyYAML --with jsonschema mypy src/slac
