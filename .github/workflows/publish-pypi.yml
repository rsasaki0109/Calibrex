name: Publish to PyPI

# Uploads the wheel and sdist of a published GitHub release to PyPI with trusted
# publishing (OIDC, no API token). One-time setup:
#   1. PyPI: add a trusted publisher for project "calibrex" (owner rsasaki0109,
#      repository Calibrex, workflow publish-pypi.yml, environment pypi).
#   2. GitHub: create the "pypi" environment (optionally with required reviewers).
# A release published by the Publish release workflow uses GITHUB_TOKEN, which does not
# trigger "release: published", so run this workflow manually with the tag in that case.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Published release to upload to PyPI, e.g. v0.6.5"
        required: true

permissions:
  contents: read

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/calibrex/
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check the release is published and matches the package version
        run: |
          [[ "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          version="$(
            python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])'
          )"
          test "${RELEASE_TAG}" = "v${version}"
          test "$(gh release view "${RELEASE_TAG}" --json isDraft --jq .isDraft)" = "false"
          echo "RELEASE_VERSION=${version}" >> "${GITHUB_ENV}"
      - name: Download the release assets
        run: |
          mkdir dist
          gh release download "${RELEASE_TAG}" --dir dist \
            --pattern "calibrex-${RELEASE_VERSION}-py3-none-any.whl" \
            --pattern "calibrex-${RELEASE_VERSION}.tar.gz"
          test "$(ls dist | wc -l)" = "2"
      - name: Check the distributions
        run: |
          python -m pip install twine
          python -m twine check --strict dist/*
      - name: Upload to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
