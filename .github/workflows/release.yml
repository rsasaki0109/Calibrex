name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Local release smoke
        run: python tools/local_release_smoke.py
      - name: Verify tag matches package version
        run: |
          package_version="$(
            python -c 'from pathlib import Path; import tomllib; print(tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"])'
          )"
          test "${GITHUB_REF_NAME}" = "v${package_version}"
      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists" >&2
            exit 1
          fi
          gh release create "$tag" dist/* \
            --draft \
            --prerelease \
            --generate-notes \
            --title "$tag" \
            --notes "Calibration evidence, not just a matrix. Review CHANGELOG.md, wheel smoke results, license boundaries, and public dataset notes before publishing this draft."
