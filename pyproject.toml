[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "calibrex"
version = "0.3.0"
description = "Simultaneous localization and calibration evidence framework for robotics"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
  { name = "Calibrex Contributors" }
]
keywords = ["robotics", "calibration", "calibrex", "autonomous-driving", "sensor-fusion"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
  "Typing :: Typed",
]
dependencies = [
  "jsonschema>=4.18",
  "numpy>=1.21",
  "pydantic>=2.6",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "mypy>=1.10",
  "numpy>=1.21",
  "pytest>=8.0",
  "ruff>=0.5",
]
mcap = [
  "mcap>=1.1",
]
rosbag1 = [
  "numpy>=1.21",
]
rosbag1-lz4 = [
  "numpy>=1.21",
  "lz4>=4.0",
]
rosbag2 = [
  "numpy>=1.21",
]
rosbag2-compression = [
  "numpy>=1.21",
  "lz4>=4.0",
  "zstandard>=0.22",
]
open3d = [
  "open3d>=0.18",
]
autonomous = [
  "mcap>=1.1",
]
docs = [
  "mkdocs-material>=9.5",
  "mkdocs-include-markdown-plugin>=6.0",
]

[project.scripts]
calibrex = "calibrex.cli.main:main"

[project.urls]
Homepage = "https://github.com/rsasaki0109/Calibrex"
Repository = "https://github.com/rsasaki0109/Calibrex"
Issues = "https://github.com/rsasaki0109/Calibrex/issues"
Changelog = "https://github.com/rsasaki0109/Calibrex/blob/main/CHANGELOG.md"
Documentation = "https://rsasaki0109.github.io/Calibrex/"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
calibrex = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.10"
strict = true
mypy_path = "src"
packages = ["calibrex"]
warn_unused_ignores = true
warn_redundant_casts = true
disallow_any_generics = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["yaml", "jsonschema"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["numpy", "numpy.*", "lz4", "lz4.*", "zstandard", "zstandard.*"]
follow_imports = "skip"
ignore_missing_imports = true
