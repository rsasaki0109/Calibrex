# Pre-registration of the board camera-LiDAR audit on KITTI's calibration recordings:
# calibrex.evaluation.board_camera_lidar run once on recordings no Calibrex method has read,
# scored against KITTI's own camera-LiDAR calibration of each day.
# It is binding once committed; tools/kitti_board_camera_lidar_evaluate.py at
# frozen_code_commit is the only code that reads the recordings, and it runs once.
#
# Written on 2026-11-03.  The checkerboard method was developed on synthetic boards and on
# the ACSC sample (Livox Horizon, development data, spent: docs/benchmarks/
# board_camera_lidar.md).  KITTI's raw data hold one calibration recording per day: the
# vehicle stands still in front of a dozen checkerboards of different sizes, all in view
# at once (KITTI calibrated with the single-shot method of Geiger et al., ICRA 2012).  Of
# these recordings only the archives' sizes, ETags and central directories (file names
# and sizes) have been read: no image, point cloud or OXTS record has been downloaded,
# decoded or read.  The calibration archives (calib_cam_to_cam.txt, calib_velo_to_cam.txt)
# were read by the KITTI camera-LiDAR pre-registrations v1 and v2 and are pinned by their
# SHA-256 from there.
#
# What is new for these recordings and frozen here, developed on synthetic single shots
# only (tests/unit/test_board_camera_lidar_multi.py, test_kitti_board_camera_lidar_evaluate.py):
# find_boards (every board of an image: OpenCV's findChessboardCornersSBWithMeta with
# CALIB_CB_LARGER, the found board painted over, repeat); a board per pose in
# calibrate_board; each board's square size from KITTI's stereo pair (the boards' sizes
# are not documented); and CameraModel.normalize iterating radial-tangential
# undistortion to convergence (OpenCV's default five iterations left up to 4 px in the
# corners of a lens like KITTI's).
#
# The reference is KITTI's calibration of each day, itself made from these recordings with
# a target-based method: agreement says the two methods agree on the same data, not that
# either is right; a disagreement beyond the gates is a failure of this method or a sign
# of the reference's error, and is reported as a failure either way.
claims:
  kitti-board-camera-lidar-accuracy:
    text: >-
      On KITTI's five calibration recordings (2011_09_26_0119, 2011_09_28_0225,
      2011_09_29_0108, 2011_09_30_0072, 2011_10_03_0058), which no Calibrex method had
      read, the checkerboard camera-LiDAR calibration of tools/kitti_board_camera_lidar_evaluate.py
      (every board of the still left grey image, square sizes from the stereo pair, the
      Velodyne scans of the still interval), started from the axis permutation only,
      converges on every day and its T_camera_lidar is within 0.5 deg of rotation and
      0.20 m of position of that day's KITTI calibration (calib_velo_to_cam, the
      unrectified left grey camera).
    gates:
      converged: the calibration's status is converged (at least 4 boards with a LiDAR plane)
      max_rotation_error_deg: 0.5
      max_position_error_m: 0.20
      days_required: 5
    source_of_gates: >-
      The user's acceptance rule for a calibration in this repository (converged, rotation
      error under 0.5 deg, position error under 0.20 m), fixed before any result and not
      to be loosened after it.
  kitti-board-camera-lidar-check-honesty:
    text: >-
      On every day where it converges, and on at least 3 days, no axis the calibration
      reports as observed is beyond twice max(3 std, floor) of that day's KITTI
      calibration, with floors of 0.5 deg and 0.02 m: calibrex check --board's fail rule,
      applied to KITTI's calibration as the candidate.
    gates:
      sigma_k: 3.0
      rotation_floor_deg: 0.5
      translation_floor_m: 0.02
      fail_factor: 2.0
      min_converged_days: 3
