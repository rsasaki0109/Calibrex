method:
  inputs: >-
    From calib_cam_to_cam.txt: K_00, D_00, K_01, D_01 (the unrectified grey cameras,
    radial-tangential) and R_01, T_01 (their stereo extrinsic).  calib_velo_to_cam.txt is
    read only after the day's estimate is written, to score it.
  still_interval: the longest run of OXTS records with ground speed hypot(vf, vl) under 0.1 m/s
  frame: >-
    find_boards (minimum pattern 4 x 3 inner corners, at most 30 boards) on every image_00
    frame in the still interval; the frame with the most boards, the earliest on a tie
  square_size: >-
    find_boards on the image_01 frame within 5 ms of it; for each left board, the right
    board of as many corners and the corner order (eight turns and flips of its grid) that
    triangulate with the smallest mean reprojection error, at most 1.0 px; the median
    distance between neighbouring triangulated corners.  A left board without one is left
    out.
  pose: PnP (IPPE, Levenberg-Marquardt) on the undistorted left corners with that square size
  lidar: the 20 Velodyne scans of the still interval nearest the frame's time, accumulated
  calibration: >-
    calibrate_board with a board per pose and the default bounds (translation std 0.02 m,
    rotation std 0.3 deg), started from the axis permutation (Velodyne x forward, y left,
    z up into the camera's optical axes) with zero translation
  never_an_input: KITTI's camera-LiDAR calibration (calib_velo_to_cam.txt)
run_recipe:
  command: >-
    python tools/kitti_board_camera_lidar_evaluate.py --work-dir WORK --output-dir RUNS,
    from a checkout whose src/ and tools/ equal frozen_code_commit, run once.  Each day's
    extract archive is fetched with If-Match on its pinned ETag and its size checked, the
    calibration archive's SHA-256 checked; a mismatch stops the run.  RUNS/DAY_estimate.json,
    DAY_score.json and summary.json are the results.
  frozen_code_commit_note: >-
    The commit that adds this file adds this file, its test and docs, not code.
invalidates:
  - a change to src/ or tools/ after frozen_code_commit before the run is done
  - reading any image, point cloud or OXTS record of the five recordings before the run
  - running the harness on them more than once, or changing a gate after the run
analysis_plan: >-
  Report per day the boards found and used, their square sizes and stereo errors, the
  per-axis errors, stds and observed flags, and both verdicts, in
  docs/benchmarks/board_camera_lidar.md, whatever they are, and record the five
  recordings as spent in docs/sota_handoff.md.
