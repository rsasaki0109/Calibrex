run_recipe:
  frozen_code_commit_note: >-
    Run from a checkout whose src/ and tools/ equal frozen_code_commit; the commit that
    adds this file changes docs only.
  driver: >-
    python tools/kitti_camera_lidar_sota_evaluate.py --preregistration
    docs/benchmarks/kitti_camera_lidar_preregistration.yaml --work-dir WORK --output-dir
    RUNS.  It downloads 2011_09_26_calib.zip (its SHA-256 must equal
    calibration_archive_sha256, or nothing runs) and then one drive at a time; a drive
    whose archive size or ETag differs from archives is not run and fails.  It records
    every archive's SHA-256, unzips it, runs tools/kitti_camera_lidar_sota_run.py and
    deletes the drive, the archive and the bag.
  velodyne_time: azimuth
  velodyne_time_rationale: >-
    Chosen on the development drives.  With the same code, the conversion without the
    per-point time (none) also passes KITTI's calibration on all 13 drives, but judges axes
    up to 7.38 deg off KITTI in turned runs (0057 roll, 3 deg pitch turn; 2.18 deg on 0014,
    whose 1 deg yaw turn reads -1.00); with it (azimuth) the worst is 0.89 deg
    (docs/assets/kitti_camera_lidar/development/scores.json and velodyne_time_none/).
  injections: ['x:3', 'y:3', 'z:3', 'x:1', 'y:1', 'z:1']
  per_drive: >-
    calibrex convert kitti-raw DRIVE --calib-dir CAL --camera image_02 --velodyne-time
    VELODYNE_TIME --output BAG --overwrite; then, at once as separate processes, calibrex
    check BAG --pairs camera-lidar --no-cache --fail-on never --evidence-dir ... --output
    baseline.json, and the same with --tf INJECTION_frames.yaml for every injection (the
    camera turned by DEG about its own AXIS: T_camera_lidar' = Rot(AXIS, DEG) T_camera_lidar).
    The check's defaults are used: at most 48 scans, 1 s apart, or spread over a recording
    shorter than that.
  rerun_policy: >-
    A run is done once.  It is repeated only when the process failed before writing its
    artifact for a reason outside the method (killed, out of memory, I/O error, a full
    disk, a failed download), with the same command.  Every artifact and every failed
    attempt is kept and listed in the audit.
  environment: >-
    The repository's .venv at frozen_code_commit (python 3.12, numpy 2.x); the exact
    versions are recorded in every manifest.
scoring:
  scorer: >-
    python tools/score_kitti_camera_lidar.py RUNS WORK/2011_09_26 OUT --drive 0011
    --drive 0013 ... (the 23 evaluation drives, in the order above), then python
    tools/build_kitti_camera_lidar_audit.py OUT/scores.json
    docs/benchmarks/kitti_camera_lidar_preregistration.yaml OUT, and calibrex sota audit
    on the protocol it writes.  Both are frozen at frozen_code_commit; their thresholds
    are module constants.
  reference: >-
    KITTI's calibration: the baseline run's candidate T_cam2_velo, which calibrex convert
    kitti-raw composes from the calibration files; the scorer checks its rotation against
    R_rect_00 R of calib_cam_to_cam.txt and calib_velo_to_cam.txt (within 1e-6 deg), and
    every turned run's candidate against that rotation turned by the injection.
  drive: >-
    A drive is failed when its archive differs from archives, or its conversion or one of
    its seven checks did not finish (non-zero exit code, or no artifact, camera-lidar pair
    record or evidence).  It is not usable when the baseline estimator refused
    (solver_status insufficient_samples: fewer usable frames than it needs); a not-usable
    drive is never gated and counts against scored-drives-coverage.  Every other drive is
    scored.
  axis: >-
    roll, pitch, yaw: the components (deg) of rotvec(R_est R_ref^T), a small rotation about
    the x, y and z axes of the camera's optical frame.  An axis is judged on a run when
    calibrex check judges it there: the pair record lists it in axes (estimated, reported
    std at most 0.5 deg, its 2 deg known-bad control detected on held-out frames, not at
    the search bound).
  trial: >-
    One injection AXIS:DEG on a scored drive.  It counts when that axis is judged on the
    drive's baseline run.  It is flagged when the turned run judges the axis warn or fail,
    judged right when it judges the axis pass, and otherwise unjudged.
  requirements:
    - {id: no-failed-drives, rule: no drive is failed}
    - {id: vendor-calibration-not-flagged, rule: no scored drive's baseline verdict is warn or fail}
    - {id: judged-axis-accuracy, rule: every judged axis of every scored baseline run has an absolute error <= 0.75 deg}
    - {id: judged-axis-coverage, rule: 'at least half of the scored baseline runs'' axes are judged, coverage'}
    - {id: turned-judged-axis-accuracy, rule: every axis judged in any turned run of a scored drive has an absolute error <= 1.5 deg}
    - {id: turn-3deg-flagged, rule: 'at most 0.1 of the counted 3 deg trials are not flagged'}
    - {id: turn-3deg-never-judged-right, rule: no counted 3 deg trial is judged right}
    - {id: turn-1deg-flagged, rule: 'at most 0.25 of the counted 1 deg trials are not flagged'}
    - {id: scored-drives-coverage, rule: 'at least 15 of the 23 drives are scored, coverage'}
  verdict_rules:
    supported: every requirement passes
    refuted: a requirement other than the two coverage requirements fails
    inconclusive: >-
      no such requirement fails, but a coverage requirement fails or a requirement has
      nothing to measure; the audit is then incomplete
threshold_rationale:
  rule: >-
    v3's rules (hilti_camera_imu_v3_preregistration.yaml): an error threshold is 1.5 times
    the worst development value, rounded up to the next 0.25 deg; the coverage floor is
    the development rate divided by 1.5, rounded down to the next 0.25.  The development
    values were computed with the frozen scorer on the 13 development drives at commit
    5d72a6c (docs/assets/kitti_camera_lidar/development/scores.json: every requirement
    passes except scored-drives-coverage, which is set for the 23 evaluation drives).
  judged-axis-accuracy: 'dev worst 0.35 deg (0057 pitch; 0.25 or less elsewhere); 1.5x = 0.525; threshold 0.75 deg'
  turned-judged-axis-accuracy: 'dev worst 0.891 deg (0057 pitch, 3 deg pitch turn; 0.45 or less elsewhere); 1.5x = 1.34; threshold 1.5 deg'
  judged-axis-coverage: 'dev 36 of 39 axes judged (0.923); / 1.5 = 0.615; threshold 0.5'
  turn-3deg-flagged: >-
    dev 36 of 36 flagged.  With none missed in 36, the 95 percent upper bound of the miss
    rate is 3 / 36 = 0.083 (rule of three); the allowance is that rounded up to 0.1.
  turn-1deg-flagged: >-
    dev 36 of 36 flagged, read 0.60 to 1.25 deg.  A 1 deg turn is twice the check's 0.5
    deg floor, so a reading 0.5 deg low misses it; the allowance is 0.25.
  turn-3deg-never-judged-right: >-
    dev 0 of 36.  Judging a 3 deg-turned axis right is the wrong verdict that matters
    most, so none is allowed; the earlier code (6ea6110) judged one right (0015 roll read
    0.45 deg), which the per-axis starts fixed.
  vendor-calibration-not-flagged: dev 0 of 13 (the first run, before the fixes, flagged 5)
  no-failed-drives: dev 0 of 13; none allowed (v3's rule)
  scored-drives-coverage: 'dev 13 of 13 (1.0); / 1.5 = 0.667 of 23 = 15.3; at least 15'
  what_was_not_judged: >-
    0014 roll and 0057 roll and yaw were never judged (controls not detected).  Their
    baseline errors were +0.25, -0.00 and +6.70 deg: 0057's yaw estimate is 6.7 deg off,
    and the check leaves it unchecked.
  known_risks: >-
    A drive that stands for most of its length keeps few frames: 0057 kept 9 of 37 (8 are
    needed), judged pitch only, and read a 3 deg pitch turn as 2.10 deg; such a drive may
    be not usable or judge little, which the coverage gates allow.  The check samples at
    most 48 scans 1 s apart whatever the drive's length (the evaluation drives have 144 to
    936 frames).  The azimuth time model is a model of KITTI's sweep, not a measurement.
invalidates:
  - a change to src/ or tools/ after frozen_code_commit before every evaluation run is done
  - changing the scorer, builder or driver, a threshold, an injection, a drive or a requirement after any evaluation run
  - running any camera-LiDAR method on an evaluation drive before this file is committed
  - an archive whose size or ETag differs from archives (that drive fails), or a calibration archive whose SHA-256 differs (nothing runs)
  - dropping a drive for any reason other than the rules above
analysis_plan:
  - Download one drive at a time, verify it, run it, delete it.
  - Score and build the audit with the frozen tools; record it with calibrex sota audit; publish it on the leaderboard whether it is supported, refuted or incomplete, with every drive and failed attempt listed.
coverage:
  minimum_dataset_families: 1
  minimum_independent_rigs: 1
  note: >-
    One rig, one day and one dataset family: every drive shares KITTI's 2011_09_26
    calibration.  The turned candidates of a drive share its images and scans.
