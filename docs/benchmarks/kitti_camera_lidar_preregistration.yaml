# Pre-registration of the KITTI camera-LiDAR check audit (v1): honest per-axis verdicts of
# calibrex check camera-lidar on KITTI raw drives it has never read.
# It is binding once committed; its SHA-256 is cited by the audit protocol, and no
# camera-LiDAR method is run on an evaluation drive before this commit.
#
# Written on 2026-10-14.  camera-lidar has no audited claim.  The method was developed on
# 13 KITTI 2011_09_26 drives: the first run on all 13 failed KITTI's own calibration on 5
# (camera_lidar_check.md#thirteen-kitti-drives-2026-10-14); the estimator was changed until
# they passed, and those 13 drives are spent.  The evaluation drives were chosen by a
# length rule from the zip archives' file lists (tools/kitti_drive_metadata.py): no image,
# point cloud or OXTS record of theirs has been downloaded, decoded or read.
#
# This is a check claim, not a calibration-accuracy claim.  The method starts at the
# candidate and judges whether each rotation axis is right; it is not compared with
# targetless calibration methods that start from large errors (docs/research/
# camera_lidar_sota_plan.md tracks those), and no external camera-LiDAR baseline is
# integrated.  The reference is KITTI's target-based calibration (calib_velo_to_cam with
# the rectification of calib_cam_to_cam), itself a calibration with error, not ground truth.
claims:
  kitti-camera-lidar-check-v1:
    text: >-
      On 23 KITTI raw 2011_09_26 drives that no Calibrex camera-LiDAR method had read,
      calibrex check --pairs camera-lidar gives honest per-axis verdicts against KITTI's
      calibration (calib_velo_to_cam with the rectification of calib_cam_to_cam): it never
      flags that calibration (no warn or fail); every rotation axis it judges there
      (reported std at most 0.5 deg and its 2 deg known-bad control detected on held-out
      frames) is within 0.75 deg of it, and it judges at least half of the axes; started at
      that calibration with the camera turned 1 or 3 deg about one of its axes, every axis
      it judges is within 1.5 deg of KITTI's calibration; it flags a 3 deg turn about an
      axis it judged on the drive in at least 90 percent of the trials and never judges
      such a turned axis right; and it flags a 1 deg turn in at least 75 percent of the
      trials.
    scope:
      modalities: [camera, lidar]
      quantities: [rotation]
      category: targetless_camera_lidar_check
    protocol_id: kitti-camera-lidar-check-v1
recordings:
  development: >-
    13 KITTI raw 2011_09_26 drives, every one camera-lidar has run on: 0005, 0009, 0014,
    0015, 0022, 0027, 0028, 0035, 0039, 0046, 0051, 0057 and 0059 (the first five were the
    lidar-vehicle development drives, the other eight its evaluation drives).  Their
    development scores are committed (docs/assets/kitti_camera_lidar/development).
  selection_rule: >-
    Every KITTI raw 2011_09_26 synced drive that no Calibrex camera-LiDAR method has read
    and that has at least 125 image_02 frames and 125 Velodyne scans (12.5 s; the shortest
    development drive, 0046, has 125).  The repository never references 0011, 0013, 0017,
    0019, 0020, 0023, 0029, 0032, 0036, 0048, 0052, 0056, 0060, 0061, 0064, 0070, 0079,
    0084, 0086, 0087, 0091, 0093, 0095, 0096, 0101, 0104, 0106, 0113, 0117 and 0119; it
    names 0001, 0002 and 0018 only for other datasets (a test's fake 2011_01_01 drive,
    KITTI-360, 2011_09_30), and none of the three was read.  Frame counts come from the
    archives' central directories; 0001 (108), 0002 (77), 0017 (114), 0020 (86), 0048 (22),
    0052 (78), 0060 (78), 0079 (100), 0113 (87) and 0119 (no image_02 or Velodyne) are
    shorter.  The 23 others are all used, whatever their size (0.6 to 3.6 GB); none is
    dropped later for any reason other than the scoring rules.
  exposure: >-
    Only each archive's HTTP headers (size, ETag) and zip central directory (file names)
    were fetched.
  evaluation: ['0011', '0013', '0018', '0019', '0023', '0029', '0032', '0036', '0056', '0061', '0064', '0070', '0084', '0086', '0087', '0091', '0093', '0095', '0096', '0101', '0104', '0106', '0117']
