    rotvec(R_day R_0926^T) in the camera's optical axes (roll, pitch, yaw): 2011_09_28
    (+0.90, -0.11, -0.13), 2011_09_29 (+0.77, +0.27, -0.02), 2011_09_30 (+0.97, -0.12,
