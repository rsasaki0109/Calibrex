# Pre-registration of the KITTI camera-LiDAR check audit (v2): honest per-axis verdicts of
# calibrex check camera-lidar on KITTI raw drives of four days it has never read, each day
# with its own calibration.
# It is binding once committed; its SHA-256 is cited by the audit protocol, and no
# camera-LiDAR method is run on an evaluation drive before this commit.
#
# Written on 2026-10-15.  v1 (kitti_camera_lidar_preregistration.yaml) was refuted, 5 of 9
# gates, on 23 KITTI 2011_09_26 drives (kitti_camera_lidar_check.md): on three drives the
# check flagged KITTI's calibration, judging axes up to 9.6 deg off it.  Reading those runs
# afterwards led to two estimator changes (camera_lidar_check.md, "After the KITTI audit"):
# a held-out control needs t >= 2.5 instead of 2, and an optimum found from the profile
# maxima replaces the candidate's only when it observes more rotation axes, at least two,
# none at the search bound.  They were developed on every 2011_09_26 drive (all spent) and
# 2011_09_30_0018.  v2 evaluates them on KITTI's other four days: 2011_09_28, 2011_09_29,
# 2011_09_30 and 2011_10_03.  Each day has its own calibration files, whose rotations
# differ from 2011_09_26's by 0.77 to 1.01 deg (mostly roll).  The evaluation drives were
# chosen by v1's length rule from the zip archives' file lists (tools/kitti_drive_metadata.py
# --date): no image, point cloud or OXTS record of theirs has been downloaded, decoded or
# read.
#
# This is a check claim, not a calibration-accuracy claim.  The method starts at the
# candidate and judges whether each rotation axis is right; it is not compared with
# targetless calibration methods that start from large errors (docs/research/
# camera_lidar_sota_plan.md tracks those), and no external camera-LiDAR baseline is
# integrated.  The reference is each day's KITTI target-based calibration
# (calib_velo_to_cam with the rectification of calib_cam_to_cam), itself a calibration
# with error, not ground truth.
claims:
  kitti-camera-lidar-check-v2:
    text: >-
      On 18 KITTI raw drives of 2011_09_28, 2011_09_29, 2011_09_30 and 2011_10_03 that
      no Calibrex camera-LiDAR method had read, calibrex check --pairs camera-lidar on
      each drive's first 600 frames gives honest per-axis verdicts against that day's
      KITTI calibration (calib_velo_to_cam with the rectification of calib_cam_to_cam):
      it never flags that calibration (no warn or fail); every rotation axis it judges
      there (reported std at most 0.5 deg and its 2 deg known-bad control detected on
      held-out frames at t >= 2.5) is within 0.75 deg of it, and it judges at least 50
      percent of the axes; started at that calibration with the camera turned 1 or 3 deg
      about one of its axes, every axis it judges is within 1.5 deg of the day's
      calibration; it flags a 3 deg turn about an axis it judged on the drive in at
      least 90 percent of the trials and never judges such a turned axis right; and it
      flags a 1 deg turn in at least 75 percent of the trials.
    scope:
      modalities: [camera, lidar]
      quantities: [rotation]
      category: targetless_camera_lidar_check
    protocol_id: kitti-camera-lidar-check-v2
    relation_to_v1: >-
      The same check command, injections, reference rule, requirements and thresholds as
      v1 (only the scored-drives floor is re-derived for 18 drives), with two estimator
      rules changed (min_control_t 2.5; the far-optimum rule) and three things new: drives
      of four days, each scored against its own day's calibration; only each drive's first
      600 frames are fetched (by HTTP range, every member's CRC-32 checked), which hold
      every frame the check reads; and the thresholds are re-derived from 37 development
      drives.
recordings:
  development: >-
    37 drives, every KITTI raw drive this check has run on: all 36 2011_09_26 drives with
    at least 125 frames (v1's 13 development and 23 evaluation drives, spent) and
    2011_09_30_0018, which earlier camera-LiDAR research in this repository read
    (docs/research/camera_lidar_sota_plan.md, docs/assets/cuda_candidates).  The rules
    were chosen by re-estimating the 36 2011_09_26 drives' saved estimator inputs in
    memory; then all 37 were run with the driver below at commit 3a05cf8, whose src/ and
    run tools equal frozen_code_commit's, and scored with the frozen scorer: every
    requirement passes (docs/assets/kitti_camera_lidar_v2/development/scores.json, with the
    driver's record).  On 2011_09_30_0018 the check passes 2011_09_30's calibration and
    flags all six turns.
  selection_rule: >-
    Every KITTI raw synced drive of 2011_09_28, 2011_09_29, 2011_09_30 and 2011_10_03 that
    no Calibrex camera-LiDAR method has read and that has at least 125 image_02 frames and
    125 Velodyne scans (v1's rule: 12.5 s, as long as v1's shortest development drive).
    The repository and its history name one drive of these days, 2011_09_30_0018
    (development here); a test also names a synthetic sequence 2011_09_30_drive_0005_sync,
    which is not a KITTI drive.  Frame counts come from the archives' central directories:
    every other drive of those days is shorter, 88 of 2011_09_28's 93 (0 to 110 Velodyne
    scans) and 2011_09_29_0108, 2011_09_30_0072 and 2011_10_03_0058 (no Velodyne scans).
    The 18 others are all used, whatever their size (0.6 to 21.2 GB; only their first 600
    frames are fetched); none is dropped later for any reason other than the scoring rules.
  exposure: >-
    Only each archive's HTTP headers (size, ETag) and zip central directory (file names,
    sizes and CRCs) were fetched, and each day's calibration archive (4 KB).  Nine of the
    drives are KITTI Odometry sequences (00, 01, 02, 04 and 06 to 10; 05 is
    2011_09_30_0018): external learned methods tracked in docs/research were trained or
    tested on them by their authors, but no such method has been run on them in this
    repository, and no Calibrex method has read them.
