run_recipe:
  frozen_code_commit_note: >-
    Run from a checkout whose src/ and tools/ equal frozen_code_commit; the commit that
    adds this file adds docs, the development scores and one test of this file, not code.
  driver: >-
    python tools/kitti_camera_lidar_v2_evaluate.py --preregistration
    docs/benchmarks/kitti_camera_lidar_v2_preregistration.yaml --work-dir WORK --output-dir
    RUNS.  It downloads each day's calibration archive (its SHA-256 must equal
    calibration_archive_sha256, or nothing runs) and then fetches and runs one drive at a
    time, the next fetch overlapping the current runs.  tools/kitti_drive_fetch.py reads
    the archive's central directory and fetches the members of the first max_frames
    frames of image_02, velodyne_points and oxts, with their timestamp and format files,
    by HTTP range requests that carry If-Match on the pinned ETag; a drive whose archive
    size or ETag differs from archives is not fetched and fails.  Every member's CRC-32
    is checked against the central directory, and the timestamp files are cut to
    max_frames lines.  The driver then runs tools/kitti_camera_lidar_sota_run.py and
    deletes the drive and the bag.
  max_frames: 600
  max_frames_rationale: >-
    calibrex check reads at most 48 scans 1 s apart from the start of a recording, and
    its loader stops once it has taken them (src/calibrex/data/ros2_camera_lidar.py), so
    a drive's first 600 frames (60 s) hold every frame it reads; a drive of 600 frames
    or fewer is fetched whole.  On 2011_09_26_0022 (800 frames) the check of v1's audit,
    whose frame loader frozen_code_commit keeps unchanged, gave identical frames, estimate
    and verdicts on the whole drive and on its first 600 frames.
  velodyne_time: azimuth
  velodyne_time_rationale: v1's, unchanged (kitti_camera_lidar_preregistration.yaml).
  injections: ['x:3', 'y:3', 'z:3', 'x:1', 'y:1', 'z:1']
  per_drive: >-
    calibrex convert kitti-raw DRIVE --calib-dir WORK/DAY --camera image_02 --velodyne-time
    VELODYNE_TIME --output BAG --overwrite; then, at once as separate processes, calibrex
    check BAG --pairs camera-lidar --no-cache --fail-on never --evidence-dir ... --output
    baseline.json, and the same with --tf INJECTION_frames.yaml for every injection (the
    camera turned by DEG about its own AXIS: T_camera_lidar' = Rot(AXIS, DEG) T_camera_lidar).
    The check's defaults are used: at most 48 scans, 1 s apart, or spread over a recording
    shorter than that.
  rerun_policy: >-
    A run is done once.  It is repeated only when the process failed before writing its
    artifact for a reason outside the method (killed, out of memory, I/O error, a full
    disk, a failed fetch), with the same command.  Every artifact and every failed attempt
    is kept and listed in the audit.
  environment: >-
    The repository's .venv at frozen_code_commit (python 3.12, numpy 2.x); the exact
    versions are recorded in every manifest.
scoring:
  scorer: >-
    python tools/score_kitti_camera_lidar_v2.py RUNS WORK OUT --preregistration
    docs/benchmarks/kitti_camera_lidar_v2_preregistration.yaml (the evaluation drives, in
    the order above), then python tools/build_kitti_camera_lidar_v2_audit.py
    OUT/scores.json docs/benchmarks/kitti_camera_lidar_v2_preregistration.yaml OUT, and
    calibrex sota audit on the protocol it writes.  Both are frozen at frozen_code_commit;
    their thresholds are module constants.  The scorer refuses to score when a day's
    calibration archive in RUNS/calibration_download.json differs from its pin.
  reference: >-
    The drive's day's KITTI calibration: the baseline run's candidate T_cam2_velo, which
    calibrex convert kitti-raw composes from that day's calibration files; the scorer
    checks its rotation against R_rect_00 R of the day's calib_cam_to_cam.txt and
    calib_velo_to_cam.txt (within 1e-6 deg), and every turned run's candidate against that
    rotation turned by the injection.
  drive: >-
    A drive is failed when its fetch failed or is incomplete (a stream with fewer frames
    than min(600, the archive's)), its archive differs from archives, or its conversion or
    one of its seven checks did not finish (non-zero exit code, or no artifact,
    camera-lidar pair record or evidence).  It is not usable when the baseline estimator
    refused (solver_status insufficient_samples: fewer usable frames than it needs); a
    not-usable drive is never gated and counts against scored-drives-coverage.  Every
    other drive is scored.
  axis: >-
    roll, pitch, yaw: the components (deg) of rotvec(R_est R_ref^T), a small rotation about
    the x, y and z axes of the camera's optical frame.  An axis is judged on a run when
    calibrex check judges it there: the pair record lists it in axes (estimated, reported
    std at most 0.5 deg, its 2 deg known-bad control detected on held-out frames at t of
    at least 2.5, not at the search bound).
  trial: >-
    One injection AXIS:DEG on a scored drive.  It counts when that axis is judged on the
    drive's baseline run.  It is flagged when the turned run judges the axis warn or fail,
    judged right when it judges the axis pass, and otherwise unjudged.
  requirements:
    - {id: no-failed-drives, rule: no drive is failed}
    - {id: vendor-calibration-not-flagged, rule: no scored drive's baseline verdict is warn or fail}
    - {id: judged-axis-accuracy, rule: every judged axis of every scored baseline run has an absolute error <= 0.75 deg}
    - {id: judged-axis-coverage, rule: 'at least half of the scored baseline runs'' axes are judged, coverage'}
    - {id: turned-judged-axis-accuracy, rule: every axis judged in any turned run of a scored drive has an absolute error <= 1.5 deg}
    - {id: turn-3deg-flagged, rule: 'at most 0.1 of the counted 3 deg trials are not flagged'}
    - {id: turn-3deg-never-judged-right, rule: no counted 3 deg trial is judged right}
    - {id: turn-1deg-flagged, rule: 'at most 0.25 of the counted 1 deg trials are not flagged'}
    - {id: scored-drives-coverage, rule: 'at least 12 of the 18 drives are scored, coverage'}
  verdict_rules:
    supported: every requirement passes
    refuted: a requirement other than the two coverage requirements fails
    inconclusive: >-
      no such requirement fails, but a coverage requirement fails or a requirement has
      nothing to measure; the audit is then incomplete
threshold_rationale:
  rule: >-
    v1's rules (kitti_camera_lidar_preregistration.yaml): an error threshold is 1.5 times
    the worst development value, rounded up to the next 0.25 deg; a coverage floor is the
    development rate divided by 1.5, rounded down to the next 0.25 (for drives, to a whole
    drive); the 3 deg allowance is the one-sided 95 percent upper bound of the development
    miss rate (exact binomial; v1's rule of three when none is missed), rounded up to the
    next 0.05.  The development values come from the frozen scorer on the 37 development
    drives (docs/assets/kitti_camera_lidar_v2/development/scores.json).
  judged-axis-accuracy: 'dev worst 0.45 deg (2011_09_26_0093 yaw; 0.25 deg on 2011_09_30_0018); 1.5x = 0.675; threshold 0.75 deg'
  turned-judged-axis-accuracy: 'dev worst 0.89 deg (2011_09_26_0057 pitch, 3 deg pitch turn; 0.35 deg on 2011_09_30_0018); 1.5x = 1.34; threshold 1.5 deg'
  judged-axis-coverage: 'dev 89 of 111 axes judged (0.80); / 1.5 = 0.53; threshold 0.5'
  turn-3deg-flagged: >-
    dev 86 of 89 flagged, read 2.10 to 3.45 deg; the three misses (2011_09_26_0029 yaw,
    0070 and 0091 pitch) are turned runs that leave the turned axis unjudged.  The 95
    percent upper bound of the miss rate is 0.085; the allowance is 0.1.
  turn-1deg-flagged: >-
    dev 89 of 89 flagged, read 0.70 to 1.50 deg.  v1's allowance and reason: a 1 deg turn
    is twice the check's 0.5 deg floor, so a reading 0.5 deg low misses it; 0.25.
  turn-3deg-never-judged-right: >-
    dev 0 of 89; none allowed (v1's rule).  v1's code judged one right on these drives
    (2011_09_26_0056 roll).
  vendor-calibration-not-flagged: >-
    dev 0 of 37; none allowed (v1's rule).  v1's code flagged 3 of the same 36 2011_09_26
    drives (0029, 0032, 0056).
  no-failed-drives: dev 0 of 37; none allowed (v1's rule)
  scored-drives-coverage: 'dev 37 of 37 (1.0); / 1.5 = 0.667 of 18 = 12; at least 12'
  what_was_not_judged: >-
    22 of 111 development baseline axes are not judged.  Five of them are more than 0.75
    deg off KITTI's calibration, and the check leaves them unchecked: 2011_09_26_0032 yaw
    (-0.80), 0056 roll (-4.60) and yaw (+1.95; 0056 judges nothing and is inconclusive),
    and 0057 roll (-2.00) and yaw (+2.85).
  known_risks: >-
    The reference is each day's KITTI calibration: if a day's calibration is off by more
    than the check's tolerance on an axis the check judges, the check is right to flag it
    and the claim fails on that day's drives.  Only one development drive (2011_09_30_0018)
    comes from an evaluation day.  The stricter control judges fewer axes (86 of 108 on
    the 2011_09_26 drives against 97 under v1's rules), and a drive that stands for most of
    its first 48 s (2011_09_28 has campus drives) may judge little or be not usable, which
    the coverage gates allow.  Highway drives (2011_10_03_0042) move about 2.5 m per sweep;
    the azimuth time model is a model of KITTI's sweep, not a measurement.
invalidates:
  - a change to src/ or tools/ after frozen_code_commit before every evaluation run is done
  - changing the scorer, builder, driver or fetcher, a threshold, an injection, a drive, max_frames or a requirement after any evaluation run
  - running any camera-LiDAR method on an evaluation drive before this file is committed
  - an archive whose size or ETag differs from archives (that drive fails), or a calibration archive whose SHA-256 differs (nothing runs)
  - dropping a drive for any reason other than the rules above
analysis_plan:
  - Fetch one drive's first 600 frames at a time, verify them, run, delete.
  - Score and build the audit with the frozen tools; record it with calibrex sota audit; publish it on the leaderboard whether it is supported, refuted or incomplete, with every drive and failed attempt listed.
coverage:
  minimum_dataset_families: 1
  minimum_independent_rigs: 1
  note: >-
    One car and one dataset family over four days, each day with its own calibration
    files.  The turned candidates of a drive share its images and scans.
