  cross_pair_reads: All seven KITTI cases had their first-600-frame Velodyne, OXTS and image_02
    read by camera-lidar v2 (evaluation) and by the later camera-lidar v3 development captures.
    calibrex check ran there with --pairs camera-lidar only; no INS-LiDAR method read them. Selection
    uses download metadata counts and order, not camera-lidar scores. The three Boreas cases appear
    in the repository only as prefix names in the first audit's bucket listing.
  selection:
    kitti_raw: 'From the eighteen other-day KITTI raw archives inventoried for camera-LiDAR v2,
      select every recording ID with at least 600 archived Velodyne frames and 600 Velodyne/OXTS
      members in its first-600-index download metadata that no INS-LiDAR method has read: the
      eligible recordings minus the first audit''s three. Inspect only live HEAD and ZIP central-directory
      metadata; retain all of them even if a pin or budget fails.'
    boreas: 'Original Boreas (2020/2021) recording prefixes in lexicographic order, after the
      first three (the first audit''s): inventory them in order until three list applanix/gps_post_process.csv,
      calib/T_applanix_lidar.txt and 600 LiDAR scans; those three are the evaluation recordings,
      and incomplete ones met on the way are retained as ineligible. First 600 lexicographically
      ordered numeric-stem LiDAR .bin keys per recording. Names, sizes and ETags only; no sensor
      or calibration object bodies read.'
  history: 'git log --all -S for each case ID on 2026-11-13: the KITTI IDs occur in the camera-lidar
    v2 pre-registration and results, the camera-lidar v3 development inventories and the first
    INS-LiDAR pre-registration (as eligible, unselected IDs); the Boreas IDs occur only in the
    first INS-LiDAR pre-registration commit (listing XML).'
  odometry_aliases:
