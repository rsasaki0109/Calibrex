development:
  v1_refutation: 'v1 (ins-lidar-rotation-kitti-boreas-v1) was refuted 6/8. Every estimated axis
    was within 0.286 deg and every control on an estimated axis was detected (8 of 8). The two
    failed gates were KITTI completion and KITTI controls, both because 2011_09_29_0071 had no
    observable rotation axis (stds 0.378, 0.226 and 1.225 deg against the 0.1 deg ceiling): the
    method reported it as unobservable, and v1 counted that as a failed recording and as a missed
    control.'
  what_v2_changes: The claim gates what the method judges (agreement and controls on estimated
    axes) and how much it judges (coverage), as camera-imu v3 did. A recording with no estimated
    axis counts in coverage with all three axes unobserved, and is not a failure. A method failure
    is still a failure. No numeric gate is looser than v1's.
  recordings:
  - '2011_09_29_0071'
  - '2011_09_30_0020'
  - '2011_09_30_0027'
  - boreas-2020-12-01-13-26
  run:
    what: tools/ins_lidar_sota_v2_evaluate.py --development on v1's four evaluation recordings
      (spent), with v1's metadata pins. Run before the freeze commit from a worktree holding these
      tools; one method attempt was killed on purpose to test the resume.
    records: docs/assets/ins_lidar_sota_v2/development/
    run_json_sha256: 06e7be647ea27ea1766f53878e705e457b026a78f1d6a8e3bac149ef968b2751
    scores_json_sha256: b17154a7aa1faac62648aa134e9eea0bc5e578d66ad2ddf115256bdeb987f0f5
    verdict_under_v2_rules: supported, 8 of 8 gates (a development result, not evidence)
    families:
      boreas:
        declared_recordings: 1
        recording_completion: 1.0
        axis_coverage: 1.0
        estimated_axes: 3
        control_misses: 0
        control_miss_rate: 0.0
        maximum_reference_difference_deg: 0.13214085532534717
      kitti_raw:
        declared_recordings: 3
        recording_completion: 1.0
        axis_coverage: 0.5555555555555556
        estimated_axes: 5
        control_misses: 0
        control_miss_rate: 0.0
        maximum_reference_difference_deg: 0.2857285405638974
    agreement_with_v1_artifacts: Statuses identical on all twelve axes; reference differences
      equal to within 2e-7 deg (another machine and library versions).
  threshold_derivation:
    error: 'ceil((1.5 * 0.2857285) / 0.25) * 0.25 = 0.5 deg, v1''s gate (worst development axis:
      2011_09_30_0020 yaw)'
    coverage: 'Development: KITTI 5 of 9 axes estimated, Boreas 5 of 6 (with v1''s development
      recording). The handoff rule floor((rate / 1.5) / 0.25) * 0.25 gives 0.25 for KITTI and
      0.5 for Boreas. v1''s stricter floor of 0.5 (unobserved fraction at most 0.5) is kept in
      both families.'
    controls: 'Development: 10 controls on estimated axes, none missed. The handoff rule (one-sided
      95 % bound, rule of three) would allow a miss fraction of 0.30; v1''s zero misses is kept.'
    completion: No method failure in any declared case; a recording with no estimated axis is
      not one.
  known_risk: 'KITTI coverage has little margin: development had 4 of 9 axes unobserved against
    a ceiling of 0.5. Driving recordings often leave roll or yaw unobservable, and 2011_10_03_0042
    is a highway drive (odometry sequence 01). The gate is not relaxed for that.'
