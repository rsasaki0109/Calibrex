    archives, and Boreas bucket listings (kept in boreas_metadata.responses). Calibration archive
    digests are reused from the camera-lidar v2 registration.'
run_recipe:
  options:
    step_frames:
    - 5
    - 10
    - 20
    block_duration_s: 5.0
    holdout_every: 3
    rotation_control_deg: 1.0
    translation_control_m: 0.1
    time_control_s: 0.02
    detection_delta_chi2: 9.0
    holdout_rotation_limit_deg: 0.5
    holdout_translation_limit_m: 0.3
    solver:
      estimate_time_offset: true
      time_offset_bound_s: 0.2
      estimate_reference_scale: true
      reference_scale_bound: 0.1
      rotation_sigma_rad: 0.0017453292519943296
      translation_sigma_floor_m: 0.01
      translation_sigma_per_m: 0.02
      huber_threshold: 1.5
      irls_iterations: 5
      yaw_starts_deg:
      - 0.0
      - 90.0
      - 180.0
      - 270.0
      axis_alignment_start: true
      extra_starts: []
      observable_rotation_std_deg: 0.1
      observable_translation_std_m: 0.02
      observable_time_offset_std_s: 0.005
      observable_reference_scale_std: 0.005
      anchor_sigma: 1000.0
      priors: []
    odometry:
      voxel_size_m: 0.5
      min_range_m: 3.0
      max_range_m: 80.0
      normal_neighbours: 10
      max_planarity_ratio: 0.2
      max_correspondence_m: 1.5
      huber_delta_m: 0.1
      max_iterations: 30
      convergence_translation_m: 0.0001
      convergence_rotation_rad: 1.0e-05
      min_correspondences: 200
      local_map_scans: 1
      deskew_iterations: 1
      geometry_quantum_m: 0.0
      motion_translation_quantum_m: 0.0
      motion_rotation_quantum_rad: 0.0
      query_workers: 1
    exclude_failed_registrations: false
  max_frames: 600
  kitti_streams:
  - velodyne_points
  - oxts
  boreas_reference: Full applanix/gps_post_process.csv, not lidar_poses.csv; crop +/-1s around
    first 600 scans inside adapter.
  odometry: LiDAR-only rigid scans, default registration; no reference/INS prior, no per-point
    deskew.
  runner: python tools/ins_lidar_sota_v2_evaluate.py docs/benchmarks/ins_lidar_rotation_v2_preregistration.yaml
    WORK RUNS
  builder: python tools/build_ins_lidar_sota_v2_audit.py RUNS/run.json docs/benchmarks/ins_lidar_rotation_v2_preregistration.yaml
    AUDIT
  source_guard: Merged main; src/tools identical to frozen_code_commit; registration on main;
    metadata digest checked; the worker refuses a calibrex imported from another checkout.
  rerun_policy: 'The run resumes by the same runner command. A method attempt that finished, PASS
    or FAIL (a crash, a timeout), is the case''s one attempt and is never repeated. A method attempt
    left RUNNING by a killed process (a container restart) produced no result that anyone saw:
    it is recorded under interrupted_attempts, what it left is kept under another name, and it
    is run again. Transport: at most two attempts per Boreas object or whole KITTI fetch, for
    transport or OS failures only; identity, ETag, SHA and budget failures are not retried. No
    replacement recordings.'
  missing_case: 'A declared case with no finished method attempt (its inputs could not be acquired
    within the transport budget) leaves every gate of its dataset family without evidence. The
    audit is then incomplete: neither supported nor refuted by that case.'
  raw_inputs: Each case's inputs are verified against their pins at acquisition and re-hashed
    by the worker before and after the fit, then deleted. The acquisition receipt keeps their
    digests.
  publication: Retain every declared case, failed attempt and interruption; publish supported,
    refuted or incomplete. No gate changes or selective reruns.
