schema_version: calibrex.ins_lidar_sota_preregistration/v0.2
protocol_id: ins-lidar-rotation-kitti-boreas-v2
claim_text: 'On the ten pre-registered KITTI raw and Boreas recording windows not previously read
  by Calibrex INS-LiDAR methods, LiDAR-only odometry followed by the default native joint trajectory
  hand-eye fit completes on every recording; every rotation axis it reports as data-estimated
  is within 0.5 deg of its dataset-provided reference calibration; at least half of the three
  rotation axes per recording are estimated on average in each dataset family; and every 1 deg
  held-out control on an estimated axis is detected with delta chi-square at least 9. A recording
  on which the method reports no estimated axis is not a failure: its three axes count as unobserved.
  Dataset calibrations are reference estimates, not independent metrology. No translation, full-extrinsic
  or absolute clock-accuracy claim is made.'
