# Pre-registration of two Hilti 2022 camera audits: camera-camera (v1) and camera-IMU (v2).
# It is binding once committed; its SHA-256 is cited by both audit protocols, and no
# Calibrex estimator reads an evaluation recording before this commit.
#
# Written on 2026-10-14.  The evaluation recordings were chosen from bag metadata only
# (the bag header and index: size, duration, per-topic message counts;
# tools/hilti_bag_metadata.py, docs/assets/hilti2022_camera_sota/candidate_metadata.json).
# Their image, IMU and LiDAR messages have not been downloaded, decoded or read by any
# tool.  The dataset's LFS pointers publish each bag's SHA-256; they are pinned below.
#
# Both claims are accuracy-against-a-reference audits, like the v1 camera-IMU audit: no
# targetless external camera-camera or camera-IMU baseline is integrated.  The reference
# is Hilti's target-based Kalibr calibration (calib_3), which is itself a calibration
# with error, not ground truth.  All sixteen Hilti 2022 sequences share that one
# calibration (the dataset's calibration/calibration_files, byte-identical to the files
# used here).
claims:
  camera-camera:
    text: >-
      On twelve Hilti 2022 recordings not used in development (the first 5 GB of each),
      Calibrex's targetless camera-camera check reproduces Kalibr's rotation of the five
      gated camera pairs within 0.75 deg on every judged axis, scores at least 70 percent
      of the gated units, flags a 1 deg turn of a side camera (cam3) and of a forward
      camera (cam1) in at least 90 percent of the evaluable trials, and names the turned
      camera in at least half of them.
    scope:
      modalities: [camera, camera]
      quantities: [rotation]
      category: targetless_camera_camera
    protocol_id: hilti-camera-camera-v1
  camera-imu-v2:
    text: >-
      On five Hilti 2022 recordings of at least 200 s not used to develop the method,
      Calibrex's targetless camera-IMU rotation for the two forward Alphasense cameras
      (cam0, cam1) agrees with Hilti's Kalibr calibration to within 1.0 deg in rotation
      angle and 0.5 ms in clock offset, is constrained by the data on all three rotation
      axes, reproduces across recordings to within 0.75 deg, and reproduces the Kalibr
      cam0-to-cam1 relative rotation to within 0.5 deg.  The claim covers the forward
      cameras only.
    scope:
      modalities: [camera, imu]
      quantities: [rotation, time_offset]
      category: targetless_camera_imu
    protocol_id: hilti-camera-imu-v2
    relation_to_v1: >-
      v1 (hilti_camera_imu_preregistration.yaml, refuted 6/7) failed only the
      constrained gate, on its shortest recording (exp04, 125.8 s, 14-15 windows).  Its
      own conclusion was that a new claim could pre-register a minimum recording length,
      on new recordings.  v2 is exactly that: v1's claim, recipe, scorer
      (tools/score_hilti_camera_imu.py, unchanged), metrics, usable-unit rule and
      thresholds, restricted to recordings of at least 200 s.  Nothing else changes.
recordings:
  development_only:
    camera-camera: >-
      exp01 and exp21 (their first 6.44 GB, data/public/hilti_2022/partial), the
      recordings the camera-camera estimator was developed on.
    camera-imu-v2: >-
      exp21 and exp07 (v1 development) and exp01-exp04 (v1 evaluation, spent).
  selection_rule: >-
    Every Hilti 2022 sequence that no Calibrex camera estimator has read: exp05, exp06,
    exp09, exp10, exp11, exp14, exp15, exp16, exp18 and the three parts of exp23 (each
