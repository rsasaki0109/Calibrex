    uses all twelve.  camera-imu-v2 uses those of at least 200 s whose full bag fits
    this environment's disk budget of 27 GB: exp15, exp16, exp23 parts 0-2; exp09
    (446.6 s, 34.1 GB) and exp10 (370.4 s, 28.3 GB) are excluded by size alone.  No
    recording is dropped later for any reason other than the usable-unit rules below.
  evaluation:
    camera-camera: [exp05, exp06, exp09, exp10, exp11, exp14, exp15, exp16, exp18, exp23p0, exp23p1, exp23p2]
    camera-imu-v2: [exp15, exp16, exp23p0, exp23p1, exp23p2]
