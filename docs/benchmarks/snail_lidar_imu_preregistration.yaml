method:
  conversion: >-
    tools/snail_lidar_imu_audit.py reads xt32/*.pcd, x36d/imu.txt, mti3dk/imu.txt and
    tf_static.launch from the zip over range requests and writes a ROS 2 bag:
    /hesai/pandar with every 4th firing of each scan (all rings, per-point absolute
    timestamp), /x36d/imu_raw and /mti3dk/imu as recorded; the first 300 s of scans
  check: >-
    calibrex check BAG --tf CANDIDATE --pairs imu-lidar --max-duration-s 300 --cache-dir
    WORK/cache-SEQ --fail-on partial, with the package's defaults (rotation tolerance
    max(3 std, 0.5 deg) per axis, fail beyond twice the tolerance)
  candidates: >-
    tf_static.launch (base_link -> x36d, mti3dk, PandarXT-32), and three copies with
    T_base_lidar' = T_base_lidar R_delta, R_delta 3 deg about the LiDAR's x (roll), y
    (pitch) or z (yaw) axis, which turns the LiDAR against every IMU.  The four share one
    estimator cache per sequence (the estimate does not depend on the candidate).
  case: one (sequence, IMU), scored from its imu-lidar pair record for each candidate
  rotation_fail: any of roll, pitch, yaw with status fail
  pass: at least one rotation axis judged and every judged rotation axis status pass
  detected: a turned candidate whose pair fails with the turned axis's own status fail
  never_an_input: >-
    The dataset's transforms are the check's candidates and the scoring reference; the
    estimator reads only the scans and IMU samples
run_recipe:
  command: >-
    python tools/snail_lidar_imu_audit.py --evaluation --jobs 3 --work-dir WORK
    --output-dir RUNS, from a checkout whose src/ and tools/ equal frozen_code_commit, run
    once.  Each zip's size and eTag are checked against the pins before it is read; a
    mismatch stops that sequence (its cases then count as missing and refute every
    claim).  RUNS/SEQ_VARIANT.json, SEQ_score.json and summary.json are the results.
invalidates:
  - a change to src/ or tools/ after frozen_code_commit before the run is done
  - reading any data of the 32 sequences before the run beyond what is listed above
  - running the harness on them more than once, or changing a gate after the run
analysis_plan: >-
  Report per case the verdicts and per-axis errors of the four candidates, and the three
  claims' verdicts, in docs/benchmarks/snail_lidar_imu.md, whatever they are; record the
  32 sequences as spent in docs/sota_handoff.md.
