# Pre-registration of the imu-lidar check audit on unseen Snail-Radar sequences:
# calibrex check --pairs imu-lidar --fail-on partial run once on the first 300 s of 32
# sequences no Calibrex method has read, with each sequence's tf_static.launch as the
# candidate and with the LiDAR turned 3 deg about its own x, y and z axes.
# It is binding once committed; tools/snail_lidar_imu_audit.py at frozen_code_commit is the
# only code that reads these sequences, and it runs once.
#
# Written on 2026-11-12.  imu-lidar's claims so far rest on Livox MID360 recordings
# (docs/benchmarks/mid360_imu_lidar.md).  Snail-Radar (Huai et al., IJRR; Open Database
# License) records a Hesai Pandar XT32 spinning LiDAR with a Bynav X36D IMU on a hand-held
# rig, an e-bike and an SUV, and from 2023-11-05 on also an Xsens MTi-3 IMU: a second LiDAR
# make, two more IMUs and two vehicle platforms.
#
# Development (spent: 20230921/data4 hand-held, 20231019/data2 e-bike, 20240113/data5 SUV,
# the three already spent by the radar roll/pitch research), first 300 s, four cases
# (data5 has both IMUs), scored by the rules below:
#   tf_static.launch as the candidate: no rotation axis failed; 3 of 4 cases passed every
#     judged rotation axis (data4's yaw warned, 0.81 deg against a 0.5 deg tolerance); every
#     case judged at least one rotation axis (hand-held and e-bike roll, pitch and yaw; the
#     SUV roll and pitch with the X36D, pitch only with the MTi-3).
#   LiDAR turned 3 deg: every judged turned axis failed (9 of 9), and each of the 4 cases
#     detected at least one turn.  The uncapped run of data4 (622 s) agreed.
#   The check's translation axes are not scored: the dataset's lever arms are hand
#     measured (data2's y failed by 0.05 m, data4's z warned).
# The reference is the dataset's own: the X36D-XT32 rotation was fitted by its authors
# with KISS-ICP and the X36D on 20230921/data5 (so that sequence is excluded), the
# MTi-3 transform comes from LI-Init.  It is reference evidence, not ground truth; a
# disagreement beyond the gates is reported as a failure either way.
#
# Of the 32 sequences only the zips' sizes and OneDrive eTags (item metadata) have been
# read, and the sequence list with durations from the dataset's web page.  They are every
# Snail-Radar sequence of at least 300 s that is not spent and is not 20230921/data5,
# chosen by length alone.
claims:
  snail-imu-lidar-check-honesty:
    text: >-
      On the first 300 s of the 32 sequences below (the X36D on all, the MTi-3 on the 28
      from 2023-11-05 on: 60 cases), calibrex check with the sequence's tf_static.launch as
      the candidate fails no roll, pitch or yaw axis of imu-lidar on any case, and passes
      every judged rotation axis, with at least one judged, on at least 50 % of the cases.
    gates:
      max_reference_rotation_fails: 0
      min_reference_pass_fraction: 0.5
  snail-imu-lidar-check-coverage:
    text: >-
      With the reference candidate, check judges at least one rotation axis on at least
      50 % of the 60 cases.
    gates:
      min_reference_judged_fraction: 0.5
  snail-imu-lidar-check-detection:
    text: >-
      With the LiDAR turned 3 deg about its x, y or z axis (180 turned cases), check fails
      imu-lidar with the turned axis's own status fail whenever that axis is judged, and
      detects at least one of the three turns on at least 50 % of the 60 cases.
    gates:
      max_judged_turns_missed: 0
      min_detecting_case_fraction: 0.5
  source_of_gates: >-
    The fractions are the development rates divided by 1.5 and rounded down to the next
    0.25 (0.75, 1.0 and 1.0), the rule of the earlier check pre-registrations; a fail of
    the reference or a missed judged 3 deg turn is a plain honesty/detection rule.  Fixed
    before any of these sequences was read and not to be changed after the run.  Every
    case exits 1 under --fail-on partial (the LiDAR's x or z translation is always
    unchecked), so exit status is not scored.
