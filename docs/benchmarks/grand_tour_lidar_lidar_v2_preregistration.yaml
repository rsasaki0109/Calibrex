methods:
  calibrex_dense:
    kind: calibrex
    flags:
    - --map-half-window-scans
    - 0
    - --window-sensitivity
    - 5
  calibrex_sparse:
    kind: calibrex
    flags:
    - --preset
    - unitree-go2-l1
emulated_sparse_target:
  max_points: 2000
  max_range_m: 20.0
  seed: 0
same_time_fractions:
- 0.1
- 0.3
- 0.5
- 0.7
- 0.9
sensor_input: Direct Zarr replay of the converter point mask, point time conventions (Hesai absolute seconds,
  Livox absolute nanoseconds) and seeded Livox subset. Reference odometry and registration are CPU, with
  Calibrex defaults and four registration query workers. Each fit starts from the released static transforms.
rotation_floor_deg:
- 0.16
- 0.03
- 0.4
metric_definitions:
  same_time_median_m: Dense candidate median of the five raw full-density point-to-plane medians against
    the nearest Hesai scans. The dataset tf can be reported as a comparison, separate from the gates.
  rotation_ratio: For each mission and each Hesai reference-frame rotation axis take the absolute component
    of log(R_i R_peer_mean^T), in degrees. The mean is the chordal SO(3) mean. Divide by sqrt(s_i^2 +
    sum(s_j^2)/(n-1)^2) with s = max(std_reported, [0.16, 0.03, 0.40] degrees) componentwise. The maximum
    across axes is the mission score. This is an empirical tolerance on rotation reproducibility, including
    potential mount changes.
  estimated_fraction: Of six axes, the fraction estimated with a detected held-out perturbation. Score
    the mean across the four missions. The perturbations are 1 degree and 5 cm at delta chi-square >=
    9 under the fixed solver defaults.
failure_policy: Dense requires a finite same-time median and three estimated rotation axes with detected
  controls and at least 100 held-out correspondences, and the fit may not have policy status fail. A missing
  valid dense rotation prevents computing peer means and fails dense completeness. Sparse accepts pass
  or inconclusive with a transform, at least 100 held-out correspondences and detected controls on every
  estimated axis. A dropped axis contributes zero to the six-axis denominator. Missing or invalid evidence
  in either method fails that method and mission.
rerun_policy: For transport only, curl retries transient errors at most twice under the same URL. Each
  download is checked against the frozen SHA-256. A failed integrity check or processing error makes the
  corresponding evidence unavailable, with no retry of a sensor fit or same-time calculation. Missing
  evidence is a failure. Every step is captured in runs.json.
