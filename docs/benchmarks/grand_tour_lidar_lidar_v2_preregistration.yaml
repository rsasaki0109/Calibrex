# Frozen GrandTour LiDAR-LiDAR v2 protocol
frozen_code_commit: 2471ae6659c0c3d9ec75aca3843f4b20d94685bd
execution: The two freeze commits are pushed to the named branch and verified before downloading evaluation
  archives. Run once from the pre-registration commit, with identical src, tools, pyproject.toml and uv.lock
  to the frozen code commit. No PR or merge is required.
claim: On four previously unread GrandTour missions on distinct days, the dense estimate supplies judged
  rotation and aligns same-time full-density scans within 55 mm. Its largest rotation deviation relative
  to the chordal mean of other missions is within 1.5 times the combined reported uncertainty after applying
  the all-day empirical floor. For the L1-like target, each mission supplies valid held-out evidence with
  every estimated axis detecting its known-bad control, and at least half of axes are estimated across
  the missions.
