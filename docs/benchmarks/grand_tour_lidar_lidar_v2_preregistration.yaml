  - dense
  - failure_rate
  - null
  - less_equal
  - 0.0
- - dense-same-time
  - dense
  - metric_maximum
  - same_time_median_m
  - less_equal
  - 0.055
- - dense-rotation-reproducibility
  - dense
  - metric_maximum
  - rotation_ratio
  - less_equal
  - 1.5
- - sparse-honesty
  - sparse
  - failure_rate
  - null
  - less_equal
  - 0.0
- - sparse-axis-coverage
  - sparse
  - metric_mean
  - estimated_fraction
  - greater_equal
  - 0.5
thresholds_from_development:
  basis: Post hoc analysis of five spent missions. Same-time and sparse coverage use committed v1 outputs
    on four of the spent missions and the spent 11-02 development result. Dense rotation uses the five
    window-zero artifacts and the all-five empirical floor from Task A. These proxies are fixed before
    evaluating the final recipe.
  same_time_worst_m: 0.033603608229635165
  same_time_rounding_m: 0.005
  rotation_ratio_worst: 0.874884
  rotation_ratio_rounding: 0.25
  sparse_coverage_rate: 0.9
  coverage_rounding: 0.25
  rule: Error gates multiply the worst development value by 1.5 and round up; coverage divides the observed
    rate by 1.5 and rounds down. Completion and detection on claimed axes are logical conditions.
environment:
  numpy: 2.5.2
  scipy: 1.18.0
  zarr: 2.18.7
  numcodecs: 0.15.2
  openblas_num_threads: 1
