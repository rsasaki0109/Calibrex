  label: rotation angle error vs Kalibr
  unit: deg
  display_scale: 1.0
  direction: lower
  primary: true
  interpretation: geodesic angle of R_est R_ref^T
- name: time_error_ms_abs
  label: absolute clock-offset difference to Kalibr
  unit: ms
  display_scale: 1.0
  direction: lower
  primary: false
  interpretation: abs(dt_est - timeshift_cam_imu)
- name: constrained_violation
  label: not constrained by the data
  unit: '1'
  display_scale: 1.0
  direction: lower
  primary: false
  interpretation: 1 unless all axes are estimated, std <= 0.3 deg, and >= 2 of 3 controls
    hit
