schema_version: slac.sota_audit_protocol/v0.1
protocol_id: mid360-imu-lidar-extrinsic-vs-li-init-v1
scope:
  modalities:
  - imu
  - lidar
  quantities:
  - rotation
  - translation
  - time_offset
  category: targetless_imu_lidar
claim_text: On two hand-held MID360 recordings of the RTK-SLAM dataset not used to
  develop the method, Calibrex's full IMU-LiDAR extrinsic predicts held-out accelerometer-integrated
  motion at least as well as LI-Init's, and so does its lever arm alone.
minimum_dataset_families: 1
minimum_independent_rigs: 1
requirements:
- requirement_id: calibrex-estimate-stadtgarten_seq1
  phase: audit
  description: Calibrex returns a passing lever-arm estimate (stadtgarten_seq1)
  dataset_family: rtk_slam
  independent_rig: true
  rig_id: rtk-slam-mid360
  evidence_path: mid360_imu_lidar_extrinsic_benchmark_stadtgarten_seq1.yaml
  evidence_sha256: 390d651ba50699e6b9f1069e59f9ef9181256777649a2bf2a2eda31328d16e41
  method_id: calibrex_native
  statistic: failure_rate
  comparison: less_equal
  threshold: 0.0
  required: true
- requirement_id: calibrex-extrinsic-not-worse-than-li-init-stadtgarten_seq1
  phase: audit
  description: paired 95 % CI lower bound of the improvement over LI-Init >= 0
  dataset_family: rtk_slam
  independent_rig: false
  evidence_path: mid360_imu_lidar_extrinsic_benchmark_stadtgarten_seq1.yaml
  evidence_sha256: 390d651ba50699e6b9f1069e59f9ef9181256777649a2bf2a2eda31328d16e41
  method_id: calibrex_native
  reference_method_id: li_init
