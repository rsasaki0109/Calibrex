schema_version: slac.config/v0.1
project:
  name: livox_horizon_horizon_full_points
  description: Offline native point-to-plane refinement using all finite public Livox
    points.
  output_dir: C:\Users\rsasa\Workspace\Calibrex\outputs\joint-point-batches-pairs-v1\shared-output
  domain: robotics
dataset:
  type: livox_pcd
  path: C:\Users\rsasa\Workspace\Calibrex\data\public\livox_horizon_horizon_pair
  time_base: frame_index
sensors:
  base_horizon:
    type: lidar
    model: livox_horizon
    frame_id: base_horizon
    fields:
    - x
    - y
    - z
    - intensity
    solid_state:
      architecture: solid_state
      scan_pattern: non_repetitive
      point_time_reference: unknown
      point_time_unit: unknown
      point_time_available: false
      intrinsic_calibration:
        source: manufacturer
        model: manufacturer_native
  target_horizon:
    type: lidar
    model: livox_horizon
    frame_id: target_horizon
    fields:
    - x
    - y
    - z
    - intensity
    solid_state:
      architecture: solid_state
      scan_pattern: non_repetitive
      point_time_reference: unknown
      point_time_unit: unknown
      point_time_available: false
      intrinsic_calibration:
        source: manufacturer
        model: manufacturer_native
frames:
  base_horizon:
    root: true
  target_horizon:
    parent: base_horizon
    transform:
      estimate: true
      initial:
        translation:
        - 0.0
        - -0.13
        - 0.0
        rotation_quat_xyzw:
        - 0.0
        - 0.0
        - 0.0
        - 1.0
      prior_sigma:
        translation_m: 0.2
        rotation_deg: 10.0
pipeline:
  type: multi_lidar_evidence
  frontends:
  - livox_pcd_reader
  - lidar_pair_voxel_evidence
  factors:
    lidar_rig_point_to_plane:
      enabled: true
      options:
        voxel_size_m: 1.0
        correspondence_gate_m: 1.5
        max_target_points: 0
solver:
  backend: native_joint_slac
  max_iterations: 40
  robust_loss: huber
  convergence_tolerance: 1.0e-06
evaluation:
  holdout_ratio: 0.2
  solid_state:
    enabled: true
    require_point_time: false
    require_temperature: false
    require_independent_holdout: false
outputs:
  result: result.yaml
  report: report.html
  artifacts_dir: artifacts
