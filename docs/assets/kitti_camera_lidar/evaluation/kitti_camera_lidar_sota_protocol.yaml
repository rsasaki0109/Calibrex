  evidence_sha256: 29000e0e10619dd09d61cab512123fc95b14ac717dd70b724990f56e766ad62b
  method_id: calibrex_check
  metric: axis_error_deg_abs
  statistic: metric_maximum
  comparison: less_equal
  threshold: 1.5
  required: true
- requirement_id: turn-3deg-flagged
