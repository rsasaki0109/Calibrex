  quantities:
  - rotation
  - translation
  category: target_board_camera_lidar
claim_text: On KITTI's five calibration recordings, the checkerboard camera-LiDAR
  calibration converges on every day and its T_camera_lidar is within 0.5 deg of rotation
  and 0.20 m of position of that day's KITTI calibration; and on every converged day,
  and on at least three, no observed axis is beyond twice max(3 std, floor).
minimum_dataset_families: 1
minimum_independent_rigs: 1
