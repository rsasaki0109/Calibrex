<title id="title">calibrex check catches a 1 degree yaw error in a deployed tf</title>
<desc id="description">On pooled KITTI development drives, the vendor tf is overall inconclusive; with velo_link yaw +1 deg the overall verdict is fail (yaw 1.31 deg against a 0.5 deg tolerance).</desc>
