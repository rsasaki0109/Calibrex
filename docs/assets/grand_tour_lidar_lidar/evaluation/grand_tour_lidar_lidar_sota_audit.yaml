claim_text: On four GrandTour missions (ANYmal D with the Boxi payload, four recording
  days) not used to develop the method, Calibrex's LiDAR-LiDAR extrinsic from a Hesai
  XT-32 to a Livox MID360 passes its own held-out evidence on every mission, reproduces
  across missions within 0.3 deg and 3 cm, and aligns single same-time scans to within
  35 mm (median point-to-plane). With the MID360 thinned to an L1-like 2,000 points
  per scan within 20 m, the per-point-trajectory mode with 10 accumulated scans also
  passes on every mission and stays within 0.25 deg and 1 cm of the dense estimate
  of the same mission.
