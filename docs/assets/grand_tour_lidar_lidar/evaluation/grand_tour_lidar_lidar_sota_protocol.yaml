schema_version: slac.sota_audit_protocol/v0.1
protocol_id: grand-tour-lidar-lidar-v1
scope:
  modalities:
  - lidar
  - lidar
  quantities:
  - rotation
  - translation
  category: targetless_lidar_lidar
claim_text: On four GrandTour missions (ANYmal D with the Boxi payload, four recording
  days) not used to develop the method, Calibrex's LiDAR-LiDAR extrinsic from a Hesai
  XT-32 to a Livox MID360 passes its own held-out evidence on every mission, reproduces
  across missions within 0.3 deg and 3 cm, and aligns single same-time scans to within
  35 mm (median point-to-plane). With the MID360 thinned to an L1-like 2,000 points
  per scan within 20 m, the per-point-trajectory mode with 10 accumulated scans also
  passes on every mission and stays within 0.25 deg and 1 cm of the dense estimate
  of the same mission.
minimum_dataset_families: 1
minimum_independent_rigs: 1
requirements:
- requirement_id: dense-pass-every-mission
  phase: audit
  description: calibrex_dense passes (all six DoFs, every control) on every mission
  dataset_family: grand_tour
  independent_rig: true
  rig_id: anymal-d-boxi
  evidence_path: grand_tour_lidar_lidar_dense_benchmark.yaml
  evidence_sha256: fe3c23cc81d04f91387f9b6c64b1edc976c0d5a0956e249b43712958bbfc4a2c
  method_id: calibrex_dense
  statistic: failure_rate
  comparison: less_equal
  threshold: 0.0
  required: true
