claim_text: 'On 18 KITTI raw drives of 2011_09_28, 2011_09_29, 2011_09_30 and 2011_10_03
  that no Calibrex camera-LiDAR method had read, calibrex check --pairs camera-lidar
  on each drive''s first 600 frames gives honest per-axis verdicts against that day''s
  KITTI calibration (calib_velo_to_cam with the rectification of calib_cam_to_cam):
  it never flags that calibration (no warn or fail); every rotation axis it judges
  there (reported std at most 0.5 deg and its 2 deg known-bad control detected on
  held-out frames at t >= 2.5) is within 0.75 deg of it, and it judges at least 50
  percent of the axes; started at that calibration with the camera turned 1 or 3 deg
  about one of its axes, every axis it judges is within 1.5 deg of the day''s calibration;
  it flags a 3 deg turn about an axis it judged on the drive in at least 90 percent
  of the trials and never judges such a turned axis right; and it flags a 1 deg turn
  in at least 75 percent of the trials.'
verdict: refuted
