  independent_rig: false
  evidence_path: kitti_camera_lidar_v2_turned_benchmark.yaml
  evidence_sha256: 3aa0486334209efd5b0bfc955cfc10c1e50aeb3b3ffcb0f79bd3ff1e09afec09
