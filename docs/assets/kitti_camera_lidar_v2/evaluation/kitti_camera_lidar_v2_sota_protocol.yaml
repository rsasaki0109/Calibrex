schema_version: slac.sota_audit_protocol/v0.1
protocol_id: kitti-camera-lidar-check-v2
scope:
  modalities:
  - camera
  - lidar
  quantities:
  - rotation
  category: targetless_camera_lidar_check
claim_text: 'On 18 KITTI raw drives of 2011_09_28, 2011_09_29, 2011_09_30 and 2011_10_03
  that no Calibrex camera-LiDAR method had read, calibrex check --pairs camera-lidar
  on each drive''s first 600 frames gives honest per-axis verdicts against that day''s
  KITTI calibration (calib_velo_to_cam with the rectification of calib_cam_to_cam):
  it never flags that calibration (no warn or fail); every rotation axis it judges
  there (reported std at most 0.5 deg and its 2 deg known-bad control detected on
  held-out frames at t >= 2.5) is within 0.75 deg of it, and it judges at least 50
  percent of the axes; started at that calibration with the camera turned 1 or 3 deg
  about one of its axes, every axis it judges is within 1.5 deg of the day''s calibration;
  it flags a 3 deg turn about an axis it judged on the drive in at least 90 percent
  of the trials and never judges such a turned axis right; and it flags a 1 deg turn
  in at least 75 percent of the trials.'
minimum_dataset_families: 1
minimum_independent_rigs: 1
requirements:
- requirement_id: no-failed-drives
  phase: audit
  description: no drive fails
  dataset_family: kitti_raw
  independent_rig: true
  rig_id: kitti-raw-car
  evidence_path: kitti_camera_lidar_v2_drives_benchmark.yaml
  evidence_sha256: 6fcc39b6250c46e97b906c52c33e9ad373f0a4a498953a95075547e1ebb85120
  method_id: calibrex_check
  statistic: failure_rate
  comparison: less_equal
  threshold: 0.0
  required: true
- requirement_id: vendor-calibration-not-flagged
  phase: audit
  description: the check flags the day's KITTI calibration on no scored drive
  dataset_family: kitti_raw
  independent_rig: false
  evidence_path: kitti_camera_lidar_v2_baseline_benchmark.yaml
  evidence_sha256: 451309b6fcebbb35ae15aebb33b55bd28e7aa6c3f97364a11b3463df239e41a0
  method_id: calibrex_check
  metric: vendor_flagged
  statistic: metric_maximum
  comparison: less_equal
  threshold: 0.0
  required: true
- requirement_id: judged-axis-accuracy
  phase: audit
  description: every judged baseline axis is within 0.75 deg of KITTI's calibration
  dataset_family: kitti_raw
  independent_rig: false
  evidence_path: kitti_camera_lidar_v2_axes_benchmark.yaml
  evidence_sha256: fe948dca79065e23bcbc86d346d214e84bafa3cf968c48b418113f04ed8ffe35
  method_id: calibrex_check
  metric: axis_error_deg_abs
  statistic: metric_maximum
