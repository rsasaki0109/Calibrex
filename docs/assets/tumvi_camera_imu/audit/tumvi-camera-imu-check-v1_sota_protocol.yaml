schema_version: slac.sota_audit_protocol/v0.1
protocol_id: tumvi-camera-imu-check-v1
scope:
  modalities:
  - camera
  - imu
  quantities:
  - rotation
  category: targetless_camera_imu_check
claim_text: On TUM-VI's corridor1-corridor5 (both fisheye cameras), calibrex check
  never fails camera-imu with Kalibr's camchain and judges a rotation axis on at least
  50 % of the cases; with T_cam_imu turned 2 deg about a camera axis it passes none
  and fails at least 50 % on the turned axis.
minimum_dataset_families: 1
minimum_independent_rigs: 1
requirements:
- requirement_id: honesty-no-fail
  phase: audit
  description: check never fails Kalibr's T_cam_imu
  dataset_family: tum_vi
  independent_rig: true
  rig_id: tumvi-handheld
  evidence_path: tumvi-camera-imu-check-v1_kalibr_check_failed.yaml
  evidence_sha256: 2e2b51e47da60579d655c2792ed530cae4747f7346d3246fc44a11a03fcdcfb9
  method_id: calibrex_camera_imu_check
  metric: kalibr_check_failed
  statistic: metric_maximum
  comparison: less_equal
  threshold: 0.0
  required: true
- requirement_id: honesty-judged
  phase: audit
  description: check judges a rotation axis on at least 50 % of the Kalibr cases
  dataset_family: tum_vi
  independent_rig: true
  rig_id: tumvi-handheld
  evidence_path: tumvi-camera-imu-check-v1_kalibr_rotation_judged.yaml
  evidence_sha256: 8cdc12845d359957babab79890fd919e21dc1a018837cc111ef960c3c5641208
  method_id: calibrex_camera_imu_check
  metric: kalibr_rotation_judged
  statistic: metric_mean
  comparison: greater_equal
  threshold: 0.5
  required: true
- requirement_id: detection-no-pass
  phase: audit
  description: check passes none of the 2 deg-turned T_cam_imu
  dataset_family: tum_vi
  independent_rig: true
  rig_id: tumvi-handheld
  evidence_path: tumvi-camera-imu-check-v1_turned_check_passed.yaml
  evidence_sha256: 2458f6c73d0f988f8bc43fe54cdffca375c4c1962901b6ec3edc724e9e6d9a81
