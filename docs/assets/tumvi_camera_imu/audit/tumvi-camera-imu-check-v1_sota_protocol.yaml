  metric: turned_check_passed
  statistic: metric_maximum
  comparison: less_equal
  threshold: 0.0
  required: true
- requirement_id: detection-fail
  phase: audit
  description: check fails at least 50 % of the turned cases on the turned axis
  dataset_family: tum_vi
  independent_rig: true
  rig_id: tumvi-handheld
  evidence_path: tumvi-camera-imu-check-v1_turned_axis_failed.yaml
  evidence_sha256: 0741a596620993ca53d7a344538d215c7d47ba3713feb0790c7021223b7a8872
