reference_calibration: KITTI calib_imu_to_velo.txt (inverted to T_imu_velo)
limitations:
- Velodyne sweeps are registered as rigid snapshots; motion within a sweep is not
  compensated.
- The KITTI calib_imu_to_velo reference is itself an estimate, not independent metrology;
  differences to it are not accuracy errors.
- OXTS positions come from a Mercator projection of GNSS/INS output and their timestamps
  are logging times; a reference scale and clock offset are estimated as nuisance
  parameters for that reason.
- Vehicle motion is close to planar, so the translation along the vertical rotation
  axis cannot be observed without a prior.
