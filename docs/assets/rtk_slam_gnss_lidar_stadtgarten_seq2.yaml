limitations:
- The reference lever arm combines the MID360 manual IMU position with a CAD antenna
  offset; it is not metrology.
- Only RTK-fixed epochs are used, so GNSS-degraded stretches of each sequence contribute
  no windows.
- LiDAR odometry has no gravity or absolute heading; each window's alignment to ENU
  is estimated and profiled out.
- The clock offset is observable only through velocity changes within a window; steady
  motion leaves it weakly constrained.
