limitations:
- The camera frame is assumed to be the optical frame (x right, y down, z forward)
  and the intrinsics are taken as correct; an intrinsics error reads as an extrinsic
  error.
- LiDAR points were moved to the image time with the rig motion from /av2/odometry
  (constant velocity between each point's and the image's time; the cloud has no per-point
  time, so a scan is moved as a whole and the rolling sweep is not compensated).
- 'Image edges and LiDAR depth discontinuities constrain rotation well and translation
  weakly (translation is a parallax effect that scales with 1/depth): on the Hilti
  2022 and KITTI recordings the translation estimate differed from the reference by
  up to 11 cm with a reported std of 1-2 cm. Translation is therefore not estimated
  by default; its held-out control is still recorded.'
- The jackknife standard deviation does not include systematic effects (lens model,
  timing, scene composition); the verdict floors cover those.
- Edge alignment needs structured scenes with depth discontinuities and image edges;
  textureless or very distant scenes yield an inconclusive result.
- 'the cloud has no per-point time: image and scan are paired at the header stamp;
  the recording is shorter than 48 scans 1 s apart, so up to 48 scans at least 0.25
  s apart were spread over it (median view change 0.073)'
