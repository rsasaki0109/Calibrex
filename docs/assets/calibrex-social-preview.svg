<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#10243c"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#background)"/>
  <circle cx="1120" cy="20" r="270" fill="#38bdf8" opacity="0.08"/>
  <circle cx="80" cy="650" r="260" fill="#818cf8" opacity="0.08"/>

  <rect x="72" y="66" width="10" height="90" rx="5" fill="url(#accent)"/>
  <text x="112" y="120" fill="#f8fafc" font-family="Inter, DejaVu Sans, sans-serif"
        font-size="58" font-weight="700">Calibrex</text>
  <text x="112" y="174" fill="#bae6fd" font-family="Inter, DejaVu Sans, sans-serif"
        font-size="28" font-weight="600">Calibration evidence, not just a matrix.</text>

  <text x="72" y="246" fill="#cbd5e1" font-family="Inter, DejaVu Sans, sans-serif"
        font-size="25">Validate robotics sensor calibration with reproducible</text>
  <text x="72" y="281" fill="#cbd5e1" font-family="Inter, DejaVu Sans, sans-serif"
        font-size="25">PASS / WARN / FAIL evidence.</text>

  <g transform="translate(72 332)">
    <rect width="350" height="170" rx="18" fill="#0f2842" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="42" cy="43" r="16" fill="#22c55e"/>
    <text x="72" y="51" fill="#f8fafc" font-family="Inter, DejaVu Sans, sans-serif"
          font-size="23" font-weight="700">Holdout metrics</text>
    <text x="28" y="98" fill="#a9bfd4" font-family="Inter, DejaVu Sans, sans-serif"
          font-size="19">Test generalization beyond</text>
    <text x="28" y="126" fill="#a9bfd4" font-family="Inter, DejaVu Sans, sans-serif"
          font-size="19">the fitted measurements.</text>
  </g>

  <g transform="translate(465 332)">
    <rect width="350" height="170" rx="18" fill="#0f2842" stroke="#f59e0b" stroke-width="2"/>
    <circle cx="42" cy="43" r="16" fill="#f59e0b"/>
    <text x="72" y="51" fill="#f8fafc" font-family="Inter, DejaVu Sans, sans-serif"
          font-size="23" font-weight="700">Known-bad controls</text>
    <text x="28" y="98" fill="#a9bfd4" font-family="Inter, DejaVu Sans, sans-serif"
          font-size="19">Verify the data can reject</text>
    <text x="28" y="126" fill="#a9bfd4" font-family="Inter, DejaVu Sans, sans-serif"
          font-size="19">a deliberately wrong result.</text>
  </g>

  <g transform="translate(858 332)">
    <rect width="350" height="170" rx="18" fill="#0f2842" stroke="#818cf8" stroke-width="2"/>
    <circle cx="42" cy="43" r="16" fill="#818cf8"/>
    <text x="72" y="51" fill="#f8fafc" font-family="Inter, DejaVu Sans, sans-serif"
          font-size="23" font-weight="700">Provenance</text>
    <text x="28" y="98" fill="#a9bfd4" font-family="Inter, DejaVu Sans, sans-serif"
          font-size="19">Schema-valid artifacts bound</text>
    <text x="28" y="126" fill="#a9bfd4" font-family="Inter, DejaVu Sans, sans-serif"
          font-size="19">to inputs and producer identity.</text>
  </g>

  <text x="72" y="576" fill="#7dd3fc" font-family="Inter, DejaVu Sans, sans-serif"
        font-size="21" font-weight="600">ROS-independent · Python 3.10+ · Apache-2.0</text>
  <text x="1208" y="576" fill="#94a3b8" text-anchor="end"
        font-family="Inter, DejaVu Sans, sans-serif" font-size="20">
    github.com/rsasaki0109/Calibrex
  </text>
</svg>
