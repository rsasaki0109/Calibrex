claim_text: On the four pre-registered KITTI raw and Boreas recording windows not
  previously read by Calibrex INS-LiDAR methods, LiDAR-only odometry followed by the
  default native joint trajectory hand-eye fit produces a scorable rotation estimate
  for every recording; every data-estimated rotation axis is within 0.5 deg of its
  dataset-provided reference calibration; at least half of the three rotation axes
  per recording are observed on average in each dataset family; and every observed-axis
  1 deg held-out control is detected with delta chi-square at least 9. Dataset calibrations
  are reference estimates, not independent metrology. No translation, full-extrinsic
  or absolute clock-accuracy claim is made.
