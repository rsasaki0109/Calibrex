schema_version: slac.sota_audit_protocol/v0.1
protocol_id: nclt-lidar-wheel-odometry-v1
scope:
  modalities:
  - lidar
  - wheel_odometry
  quantities:
  - rotation
  - lever_arm
  category: targetless_lidar_wheel_odometry
claim_text: On one hour of each of NCLT's sessions 2012-02-02, 2012-05-11, 2012-08-04,
  2012-11-04 and 2013-02-23, calibrex check's lidar-wheel_odometry estimator converges,
  its rotation is within 0.5 deg and its lever within 0.20 m of NCLT's calibration
  on every session; and check does not fail NCLT's calibration, with no rotation axis
  beyond check's fail bound, on at least three converged sessions.
minimum_dataset_families: 1
minimum_independent_rigs: 1
requirements:
- requirement_id: accuracy-converged
  phase: audit
  description: the estimator converges on every session
  dataset_family: nclt
  independent_rig: true
  rig_id: nclt-segway
  evidence_path: nclt-lidar-wheel-odometry-v1_rotation_reference_difference_deg.yaml
  evidence_sha256: f4387834c4e1bfafd90e8182aa0131dba478e16235d855dc9a6143390b7794f8
  method_id: calibrex_lidar_wheel_odometry
  statistic: failure_rate
  comparison: less_equal
  threshold: 0.0
  required: true
- requirement_id: accuracy-rotation
  phase: audit
  description: rotation within 0.5 deg of NCLT's calibration on every session
  dataset_family: nclt
  independent_rig: true
  rig_id: nclt-segway
  evidence_path: nclt-lidar-wheel-odometry-v1_rotation_reference_difference_deg.yaml
