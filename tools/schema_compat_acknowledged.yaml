# Reviewed exceptions for tools/check_schema_compat.py.
#
# Each key is either ``<schema file>#<location>`` for a narrowing of a released
# schema version, or ``artifact:<path>`` for a released artifact that current
# Calibrex cannot read.  Every entry needs a reason a reviewer can verify.  The
# checker fails when an entry no longer matches anything, so this list cannot
# silently outlive the problem it excuses.
#
# Baseline v0.5.0: the narrowings acknowledged against v0.4.1
# (external_run container_digest, result RunInfo.provenance, the A2D2 manifest)
# are part of v0.5.0 itself and no longer show up as differences.
acknowledged:
  - key: artifact:examples/raw_replay/synthetic/config.yaml
    reason: >-
      Digest-bound replay stub declared as slac.config/v0.1 but lacking
      dataset, sensors, and frames; it was already invalid when v0.5.0 was
      released and is tracked in KNOWN_INVALID_ARTIFACTS in
      tests/unit/test_schema_registry.py.
