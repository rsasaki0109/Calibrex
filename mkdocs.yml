site_name: Calibrex
site_description: Calibrex — Simultaneous localization and calibration evidence framework for robotics
site_url: https://rsasaki0109.github.io/Calibrex/
repo_url: https://github.com/rsasaki0109/Calibrex
repo_name: rsasaki0109/Calibrex
edit_uri: edit/main/docs/

docs_dir: docs

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - content.code.copy

plugins:
  - search
  - include-markdown

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.highlight

nav:
  - Home: index.md
  - Development Roadmap: development_roadmap.md
  - Benchmarks:
      - ETHZ Native vs OpenCV Hand-Eye: benchmarks/ethz_hand_eye_opencv.md
      - ETHZ Robot-World Hand-Eye: benchmarks/ethz_robot_world_hand_eye.md
      - KITTI I2I Performance Plan: research/pandey_i2i_performance.md
      - Camera-LiDAR SOTA Plan: research/camera_lidar_sota_plan.md
      - Solid-state LiDAR OSS baselines: research/solid_state_lidar_oss_baselines.md
  - Concepts:
      - SLAC: concepts/slac.md
      - LiDAR SLAC: concepts/lidar_slac.md
      - Solid-state LiDAR: concepts/solid_state_lidar.md
      - Radar Calibration Evidence: concepts/radar_evidence.md
      - Calibration Methods: concepts/calibration_methods.md
      - Frame Conventions: concepts/frame_conventions.md
      - License Boundaries: concepts/license_boundaries.md
      - Problem Builder: concepts/problem_builder.md
  - Tutorials:
      - Calibration CI: tutorials/calibration_ci.md
      - Public Datasets: tutorials/public_datasets.md
      - Solid-state public benchmark: tutorials/solid_state_public_benchmark.md
      - Solid-state benchmark report v0.3: assets/solid-state-cross-dataset-benchmark-v03.md
      - Solid-state v0.4 train-only selection: assets/solid-state-cross-dataset-benchmark-v04-train-selection.md
      - Solid-state benchmark report v0.4: assets/solid-state-cross-dataset-benchmark-v04.md
      - Open3D SLAC Adapter: tutorials/open3d_slac.md
      - Targetless LiDAR-Camera Adapter: tutorials/lidar_camera_adapter.md
  - ADRs:
      - "0001: Core Is ROS-Independent": adr/0001-core-is-ros-independent.md
      - "0004: LiDAR-Main v0.1 Evaluation Protocol": adr/0004-lidar-main-v0-1-evaluation-protocol.md
      - "0005: v0.2 Motion, Camera, and Temporal Direction": adr/0005-v0-2-motion-camera-temporal-direction.md
      - "0006: Rename to slac": adr/0006-rename-to-slac.md
      - "0007: v0.3 SLAC Direction": adr/0007-v0-3-slac-direction.md
      - "0008: v0.4 Direction — Full-Scale Modality PASS and Absolute Time": adr/0008-v0-4-scale-and-absolute-time.md
      - "0009: Restore Calibrex Name": adr/0009-restore-calibrex-name.md
  - Schemas Reference: reference/schemas.md
  - Capture Manifest: reference/capture_manifest.md
  - RadarScan Adapter: reference/radar_scan_adapter.md
  - External Adapters: reference/external_adapters.md
  - Autoware Export: reference/autoware_export.md
  - Koide Input Readiness: reference/koide_readiness.md
  - Koide Official Handoff: reference/koide_handoff.md
  - Koide Pilot Acceptance: reference/koide_pilot.md
  - Operational KPIs and Pilot Acceptance: reference/operational_kpis.md
  - Changelog: changelog.md
